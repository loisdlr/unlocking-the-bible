d] to Christ."],"words":[["Apostle","Greek apostolos","One sent with authority",""],["Doctrine","Greek didachē","Teaching, instruction","Acts 2:42."],["Continued steadfastly","Greek proskartereō","Persist, devote oneself",""],["Fellowship","Greek koinōnia","Sharing, partnership",""],["Church","Greek ekklēsia","Assembly of the called-out ones",""],["Cornerstone","Greek akrogōniaios","The foundational corner stone","Eph 2:20."]],"background":[["Modular: Church history overview","a) Apostolic Christianity — the church persecuted (AD 30–313): Nero (AD 64), Domitian (c. 95), Decius (250), Diocletian’s Great Persecution (303–311). b) The “Dark Ages” — after Constantine’s Edict of Milan (313) legalised Christianity and Theodosius made it the state religion (380), the church gained power; tradition and politics increasingly shaped doctrine. c) Reformation — Martin Luther’s 95 Theses (1517) recovered Scripture’s authority and justification by faith; Tyndale and others put the Bible in common languages. d) The church restored — this course traces the 20th-century Pentecostal revival (Topeka 1901, Azusa Street 1906) and the recovery of Jesus’-name baptism (1913–14) as a return to the apostles’ doctrine."],["Key early councils (for awareness)","Council of Jerusalem (Acts 15, c. AD 49): Gentiles need not be circumcised. Council of Nicaea (325) and Constantinople (381) shaped creeds still used by most denominations today; this course holds that the apostles’ doctrine in Scripture is the standard above later councils."],["How the NT was written down","Paul’s letters (c. AD 48–65) are the earliest NT writings; the Gospels were written c. AD 55–95; Revelation c. AD 95. Letters were copied and circulated among churches (Col 4:16)."]],"qa":[["Are there apostles today?","The Twelve had a unique, foundational role (eyewitnesses of the resurrection, Acts 1:21-22). The foundation is laid once (Eph 2:20). The NT also uses “apostle” more broadly for sent missionaries (e.g., Barnabas, Acts 14:14); churches differ on using the title today."],["Why are there so many denominations?","Over centuries, traditions, philosophy and politics were added to or replaced the apostles’ teaching (Col 2:8). This course’s answer: return to the apostles’ doctrine as recorded in Acts and the Epistles. See the Church History modular."],["Isn’t doctrine divisive? Shouldn’t we just love everyone?","Love and truth go together (Eph 4:15 “speaking the truth in love”). Jesus said truth would divide (Luke 12:51), but we treat those who differ with gentleness (2 Tim 2:24-25)."]],"quiz":[["What did the 3,000 continue steadfastly in first?",["Prayers","The apostles’ doctrine","Fasting","Giving"],1,"Acts 2:42."],["“Apostle” means…",["Teacher","One who is sent","Elder","Prophet"],1,"Apostolos."],["Who is the chief cornerstone of the Church?",["Peter","Paul","Jesus Christ","The Twelve"],2,"Eph 2:20."],["The three Ps of doctrine are…",["Pray, preach, praise","Propagate, protect, preserve","Plan, prepare, perform","Pastor, prophet, priest"],1,"Key #4."],["“Ekklesia” means…",["A building","An assembly of called-out ones","A temple","A denomination"],1,"Section E."],["Who was the Church’s first martyr?",["James","Peter","Stephen","Paul"],2,"Acts 7."]],"bridge":"Next: the end of the age — Christ’s return, the Millennium, judgment and eternity.","charts":[{"f":"charts/L10-1.jpg","t":"Apostolic doctrine","sec":1,"no":"Chart L10.1"},{"f":"charts/L10-2.jpg","t":"Church history: the Church persecuted","sec":5,"no":"Chart L10.2"},{"f":"charts/L10-3.jpg","t":"Church history: the Dark Ages","sec":5,"no":"Chart L10.3"},{"f":"charts/L10-4.jpg","t":"Church history: Reformation Christianity","sec":5,"no":"Chart L10.4"},{"f":"charts/L10-5.jpg","t":"Church history: Pentecostalism & the Church restored","sec":5,"no":"Chart L10.5"},{"f":"charts/L10-6.jpg","t":"Keys of Lesson Ten","sec":-1,"no":"Chart L10.6"}]},{"n":12,"title":"Eternity: Christ’s Return, Judgment & the New Heaven","sub":"The sequence from the Marriage Supper of the Lamb to the New Jerusalem","age":"Church Age → Kingdom Age → Eternity","cast":"Jesus, saints, sinners, angels, the Antichrist, the false prophet, Satan","bigIdea":"Jesus will return to defeat the Antichrist, reign for a thousand years, and judge all people; our choices now determine whether we spend eternity in the Lake of Fire or with God in the new heaven and earth.","objectives":["Recall the sequence of events after the tribulation leading to eternity","Describe both heaven and the lake of fire","Reassess life and priorities in light of eternity"],"flow":[{"s":"A","t":"The Marriage Supper of the Lamb","pts":["The raptured Church, the Bride of Christ, gathers for the Marriage Supper (Rev 19:7-9).","The Bride has made herself ready; fine linen = the righteous acts of the saints."],"refs":["Revelation 19:7-9","John 14:2-3","Ephesians 5:25-27","Matthew 25:1-13"],"explain":"“His wife has made herself ready” (19:7) and “to her it was granted” (19:8) — preparation and grace together (Lesson 3: grace, faith, obedience). The wedding imagery runs through the Bible: God as Israel’s husband (Hos 2:19), Christ and the church (Eph 5), the wise and foolish virgins (Matt 25).","ctx":"Jewish weddings in Jesus’ day had stages: betrothal (legally binding, a price paid); the groom returned to his father’s house to prepare a room (compare John 14:2-3 “I go to prepare a place for you”); then, at a time the father decided, the groom came — often at night with a shout — to bring the bride home for a wedding feast lasting about seven days.","ex":"Wedding preparation: no bride shows up to her wedding unprepared.","ask":"What does “making yourself ready” look like for the Bride today?"},{"s":"B","t":"The Second Coming & the Battle of Armageddon","pts":["Prophesied: Nebuchadnezzar’s dream — God’s kingdom crushes all kingdoms (Dan 2:44); Daniel’s vision — the saints possess the kingdom (Dan 7:21-27).","All nations gather against Jerusalem; the LORD fights; His feet stand on the Mount of Olives (Zech 14:1-5).","Christ on a white horse — Faithful and True, the Word of God, KING OF KINGS AND LORD OF LORDS — with the armies of heaven (Rev 19:11-16).","The beast and false prophet cast into the lake of fire; Satan bound 1,000 years (Rev 19:19–20:3)."],"refs":["Daniel 2:31-45","Daniel 7:21-27","Zechariah 14:1-5","Acts 1:11-12","Revelation 19:11-21","Revelation 20:1-3","Revelation 16:16"],"explain":"Zechariah 14:4-5: “His feet will stand on the Mount of Olives… Thus the LORD my God will come, and all the saints with You.” Acts 1:11-12: Jesus ascended from the Mount of Olives and the angels said He would return “in like manner.” Connect to Lesson 7: the LORD of Zechariah is Jesus. Rev 19:13 — His name is “The Word of God” (John 1:1, 14).","ctx":"Armageddon (Rev 16:16) = Hebrew Har Megiddo, “mountain of Megiddo,” overlooking the Jezreel Valley in northern Israel — one of history’s great battlefields: Thutmose III (c. 1457 BC), Deborah and Barak (Judges 4–5), King Josiah’s death (609 BC), and even General Allenby in 1918. Nebuchadnezzar’s statue (Dan 2) is traditionally read as Babylon (gold), Medo-Persia (silver), Greece (bronze), Rome (iron), with the stone “cut without hands” as God’s kingdom.","ex":"Show the statue of Daniel 2 as a timeline from Babylon to God’s kingdom.","ask":"How does knowing Jesus wins in the end affect how you face fear today?","key":1},{"s":"C","t":"The Millennium — the Kingdom of God on earth","pts":["Saints reign with Christ 1,000 years (Rev 20:4).","Eden recreated; animal natures changed; health restored; lifespans extended; one language; one worship; peace and justice; Jerusalem as headquarters.","Christ reigns as King of Kings; saints share in ranks of authority.","Satan released for a final rebellion (Gog and Magog), destroyed by fire (Rev 20:7-9)."],"refs":["Revelation 20:4-9","Isaiah 11:6-9","Isaiah 35:1-7","Isaiah 65:20,25","Zephaniah 3:9","Isaiah 2:4","Micah 4:3","Zechariah 14:9,16-17"],"explain":"Compare Eden — a perfect environment cannot produce a perfect heart. Even after 1,000 years of Christ’s perfect rule, people still rebel when Satan is released, proving the problem is the heart, which only new birth fixes (Lessons 8–9). Isaiah 2:4 “swords into plowshares” is inscribed on a sculpture at the United Nations — the world wants that peace, but only the Prince of Peace will bring it.","ctx":"“Millennium” comes from Latin mille (thousand) + annus (year). The early church writers Papias, Justin Martyr and Irenaeus (2nd century) taught a literal thousand-year reign (called chiliasm, from Greek chilioi, thousand).","ex":"Make a two-column chart: “Now” vs “In the Kingdom” using the Isaiah verses.","ask":"Which Millennium promise are you most looking forward to?","key":2},{"s":"D","t":"The judgments of God","pts":["“Appointed for men to die once, but after this the judgment” (Heb 9:27).","Judgment Seat of Christ — for believers’ service and rewards, not salvation (Rom 14:10-12; 2 Cor 5:10; 1 Cor 3:12-15). Crowns (2 Tim 4:8; Jas 1:12; 1 Pet 5:4; Rev 2:10).","Great White Throne — for the unsaved; books opened; judged by works (Rev 20:11-13).","Judged by the Word (John 12:48), thoughts and motives (Rom 2:16), idle words (Matt 12:36)."],"refs":["Hebrews 9:27","Romans 14:10-12","2 Corinthians 5:10","1 Corinthians 3:12-15","2 Timothy 4:8","Revelation 20:11-13","John 12:48","Romans 2:16","Matthew 12:36"],"explain":"1 Cor 3:12-15: the same fire tests all works — gold, silver and precious stones survive; wood, hay and straw burn. Quality, not quantity. John 12:48 links to Lesson 1: the Word we read now is the standard we will be judged by — so read, understand and apply it.","ctx":"“Judgment seat” = Greek bēma, the raised platform where a Roman magistrate gave verdicts — or where judges at the athletic games awarded victors’ wreaths. Paul himself stood before the bēma of Gallio in Corinth (Acts 18:12); that platform has been excavated in the Corinth agora. The crowns are stephanoi — victors’ wreaths, not royal diadems.","ex":"Five crowns: incorruptible (1 Cor 9:25), rejoicing (1 Thess 2:19), righteousness (2 Tim 4:8), life (Jas 1:12; Rev 2:10), glory (1 Pet 5:4).","ask":"If your works were tested by fire today, what would remain?","key":3},{"s":"E","t":"Eternity — the Lake of Fire","pts":["Death and Hades cast into the lake of fire — the second death (Rev 20:14-15).","Prepared for the devil and his angels (Matt 25:41).","Unquenchable fire, consciousness, torment, darkness, weeping, separation, no release, memory (Mark 9:44; Luke 16:23-28; Matt 8:12; 13:42; 25:46).","God sent His Son so that none need perish (John 3:16)."],"refs":["Revelation 20:14-15","Matthew 25:41","Mark 9:43-48","Luke 16:19-31","Matthew 8:12","Matthew 25:46","John 3:16","2 Peter 3:9"],"explain":"Matthew 25:41 — hell was “prepared for the devil and his angels,” not for people. A person must walk past the cross, the prayers of others and every warning to end up there. Teach this with tears, not with anger.","ctx":"Jesus’ word for hell is Gehenna — the Valley of Hinnom on Jerusalem’s south side, where some kings of Judah sacrificed children to Molech by fire (2 Kings 23:10; Jer 7:31). King Josiah defiled it; it became a symbol of judgment. Hades (Greek; Hebrew Sheol) is the realm of the dead before final judgment; the Lake of Fire is final.","ex":"A rescue rope thrown to someone drowning: the tragedy is not that there was no rope, but that it was refused.","ask":"How should the reality of eternity affect the way we share the gospel?","key":4},{"s":"F","t":"Eternity — a new heaven and earth","pts":["New Jerusalem descends as a bride (Rev 21:2, 10-27).","12 gates (tribes of Israel), 12 foundations (apostles), pure gold like glass, pearl gates, no temple, no sun — God and the Lamb are its light.","River of life, tree of life, no more curse, we shall see His face (Rev 22:1-6).","Genesis vs Revelation: paradise lost → paradise regained.","“Surely I am coming quickly. Even so, come, Lord Jesus!” (Rev 22:20)."],"refs":["Revelation 21:1-27","Revelation 22:1-21"],"explain":"Read the Genesis–Revelation contrast table: paradise closed (Gen 3:23) → opened (Rev 21:25); curse imposed (3:17) → lifted (22:3); tree of life lost (3:24) → regained (22:14); sorrow begins (3:16) → ends (21:4); dominion forfeited (3:19) → restored (22:5); serpent triumphs (3:13) → Lamb triumphs (20:10). The Bible ends where it began — but better: a garden-city with God dwelling among His people (21:3, “the tabernacle of God is with men” — Lesson 6). Rev 22:4: “They shall see His face, and His name shall be on their foreheads.”","ctx":"Revelation was written by John on the island of Patmos (c. AD 95, under Emperor Domitian) to persecuted churches in Asia Minor (modern Turkey). The city measures 12,000 furlongs (stadia) — about 2,200 km (1,400 miles) each way — and is a cube like the Most Holy Place of the Tabernacle (Lesson 6): the whole city is God’s presence. The 12 foundation stones echo the 12 stones on the high priest’s breastplate (Ex 28:17-21).","ex":"Close with the Genesis/Revelation chart: the whole course in one table.","ask":"Reflection: in light of eternity, what priority needs to change in your life?","key":5}],"keys":["The [Antichrist] and his army will be defeated by Jesus at His [second coming].","Our [choices] determine where we will end up in [eternity].","The [Word of God] will judge us.","The Lake of fire is the destination for those who choose [not] to be saved.","Heaven is the destination for those who choose to [love], [obey] and [follow] Jesus."],"words":[["Armageddon","Hebrew Har Megiddo","Mountain of Megiddo","Rev 16:16."],["Millennium","Latin mille + annus","A thousand years","Rev 20:4."],["Judgment seat","Greek bēma","Raised judge’s / award platform","2 Cor 5:10."],["Crown","Greek stephanos","Victor’s wreath",""],["Hell","Greek Gehenna","Valley of Hinnom","Mark 9:43."],["Hades / Sheol","Greek / Hebrew","Realm of the dead before final judgment",""],["Alpha and Omega","Greek letters","First and last letters — the Beginning and the End","Rev 22:13."]],"background":[["Sequence of end-time events (as taught in this course)","Rapture of the Church → Tribulation on earth (Marriage Supper of the Lamb in heaven) → Second Coming & Armageddon → Satan bound; 1,000-year reign → Satan released, final rebellion → Great White Throne Judgment → Lake of Fire / New Heaven and New Earth."],["Other views","This course teaches a premillennial view (Christ returns before a literal 1,000-year reign). Amillennial and postmillennial views are held in other traditions. If a student asks, acknowledge differences and focus on the shared certainties: Christ will return, judge, and make all things new."],["Revelation’s first readers","Seven churches in Asia Minor (Rev 2–3) faced emperor worship and persecution. Revelation assured them that Caesar is not Lord — the Lamb is, and He wins."]],"qa":[["When will Jesus return?","No one knows the day or hour (Matt 24:36). Our job is to be ready (Matt 24:44) like Noah (Lesson 3)."],["Is hell forever?","Jesus used the same word “everlasting” (aiōnios) for both punishment and life in Matthew 25:46. The Bible presents it as final."],["Will we recognise each other in heaven?","Jesus’ resurrection body was recognisable (Luke 24:39; John 20:27), and Paul comforts believers with reunion (1 Thess 4:13-18)."],["What about people who never heard the gospel?","God is just and judges according to the light people had (Rom 2:12-16), and He is not willing that any perish (2 Pet 3:9). That’s why He commands us to go (Matt 28:19)."],["Will we be bored in heaven?","Rev 22:3-5 says His servants shall serve Him and reign forever — eternity is full of worship, purpose and joy, not idleness."]],"quiz":[["Armageddon is named after…",["A city in Egypt","The mountain of Megiddo","Mount Sinai","Babylon"],1,"Har Megiddo."],["How long is Satan bound?",["7 years","40 years","1,000 years","Forever"],2,"Rev 20:2."],["The Judgment Seat of Christ is for…",["Deciding who is saved","Rewarding believers’ service","Judging Satan","Judging angels"],1,"2 Cor 5:10; 1 Cor 3:12-15."],["At the Great White Throne the dead are judged by…",["Their family","Their works and the books","Their wealth","Their church"],1,"Rev 20:12."],["Which is NOT in the New Jerusalem?",["Tree of life","A temple","River of life","Gates of pearl"],1,"Rev 21:22 — God and the Lamb are its temple."],["The shape of the New Jerusalem matches which part of the Tabernacle?",["The court","The Most Holy Place (a cube)","The laver","The gate"],1,"Rev 21:16."]],"bridge":"Course complete! Respond to the gospel: repentance, baptism in Jesus’ name, and receiving the Holy Spirit (Lessons 8–9).","charts":[{"f":"charts/L12-1.jpg","t":"The end times: Second Coming & Armageddon","sec":1,"no":"Chart L12.1"},{"f":"charts/L12-2.jpg","t":"The end times: Millennium, judgment, Lake of Fire, Heaven","sec":2,"no":"Chart L12.2"},{"f":"charts/L12-3.jpg","t":"Keys of Lesson Twelve","sec":-1,"no":"Chart L12.3"}]}];
</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('utbs_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('utbs_'+k,JSON.stringify(v))}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('s'),1600)}
const byN={};L.forEach(l=>byN[l.n]=l);
const AGES=["Innocence","Conscience","Human Government","Promise","Law","Church Age","Kingdom"];
const AGEMAP={1:[],2:[0,1],3:[1,2],4:[2,3],5:[3,4],6:[4],7:[4,5],8:[5],9:[5],10:[5],12:[5,6]};
const THREAD=[["Gen 3:21","Animal skins",2],["Gen 4:4","Abel’s lamb",3],["Gen 22:13","Ram for Isaac",4],["Ex 12","Passover lamb",5],["Lev 16","Day of Atonement",6],["John 1:29","Lamb of God",7],["Acts 2:38","Blood applied",8],["Rev 22:3","Throne of the Lamb",12]];
const BOOKS="Genesis Exodus Leviticus Numbers Deuteronomy Joshua Judges Ruth 1_Samuel 2_Samuel 1_Kings 2_Kings 1_Chronicles 2_Chronicles Ezra Nehemiah Esther Job Psalm Proverbs Ecclesiastes Song_of_Solomon Isaiah Jeremiah Lamentations Ezekiel Daniel Hosea Joel Amos Obadiah Jonah Micah Nahum Habakkuk Zephaniah Haggai Zechariah Malachi Matthew Mark Luke John Acts Romans 1_Corinthians 2_Corinthians Galatians Ephesians Philippians Colossians 1_Thessalonians 2_Thessalonians 1_Timothy 2_Timothy Titus Philemon Hebrews James 1_Peter 2_Peter 1_John 2_John 3_John Jude Revelation".split(' ').map(b=>b.replace(/_/g,' '));
let state={view:'home',lesson:null,tab:'study'};
let studied=store.get('studied',{});
let ageFilter=null,keyMode='type',wordView='cards',qz={};
/* ---------- charts ---------- */
function figHtml(l,list,one){if(!list.length)return '';return `<div class="figs ${one?'one':''}">${list.map(c=>{const i=l.charts.indexOf(c);return `<figure class="fig" onclick="openLB(${l.n},${i})"><img src="${c.f}" alt="${esc(c.t)}" loading="lazy"><figcaption><span>${esc(c.no)}</span>${esc(c.t)}</figcaption></figure>`}).join('')}</div>`}
function secCharts(l,i){return figHtml(l,(l.charts||[]).filter(c=>c.sec===i),false)}
function chartsV(l){return `<p class="muted" style="margin-top:0">All ${l.charts.length} charts for this lesson. Tap one to view full screen; use ← → to move between them.</p>`+figHtml(l,l.charts,false)}
let LB={n:0,i:0};
function openLB(n,i){LB={n,i};drawLB();$('#lb').classList.add('open')}
function closeLB(){$('#lb').classList.remove('open')}
function stepLB(d){const c=byN[LB.n].charts;LB.i=(LB.i+d+c.length)%c.length;drawLB()}
function drawLB(){const c=byN[LB.n].charts,x=c[LB.i];$('#lb').innerHTML=`<div class="cnt">Lesson ${LB.n} · ${LB.i+1} of ${c.length}</div><img src="${x.f}" alt="${esc(x.t)}"><div class="cap"><span>${esc(x.no)}</span>${esc(x.t)}</div><button class="lbx" onclick="closeLB()" aria-label="Close">×</button>${c.length>1?`<button class="lbp" onclick="stepLB(-1)" aria-label="Previous">‹</button><button class="lbn" onclick="stepLB(1)" aria-label="Next">›</button>`:''}`}
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('open'))return;e.stopImmediatePropagation();e.preventDefault();if(e.key==='Escape')closeLB();else if(e.key==='ArrowRight')stepLB(1);else if(e.key==='ArrowLeft')stepLB(-1)},true);
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLB()});


function renderNav(){
  $('#navTop').innerHTML=[['home','⌂','Start here'],['scripture','✎','Scripture index']].map(([v,i,t])=>`<button class="${state.view===v?'on':''}" onclick="go('${v}')"><span class="num">${i}</span><span class="lt">${t}</span></button>`).join('');
  $('#navL').innerHTML=L.map(l=>`<button class="${state.view==='lesson'&&state.lesson===l.n?'on':''}" onclick="go('lesson-${l.n}')"><span class="num ${studied[l.n]?'done':''}">${l.n}</span><span class="lt">${esc(l.title)}</span></button>`).join('');
}
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h;$('#side').classList.remove('open');document.body.classList.remove('menuopen')}
const TABS=[['study','Study'],['charts','Charts'],['keys','Key points'],['words','Word studies'],['background','Background'],['qa','Questions'],['quiz','Quiz'],['notes','My notes']];
function route(){
  const h=location.hash.slice(1)||'home';
  const m=h.match(/^lesson-(\d+)(?:-(\w+))?$/);
  if(m&&byN[m[1]]){state.view='lesson';state.lesson=+m[1];state.tab=TABS.some(t=>t[0]===m[2])?m[2]:'study'}
  else if(h==='scripture')state.view='scripture';
  else if(/^s-\d+-\d+$/.test(h)){const [,n,i]=h.split('-');state.view='lesson';state.lesson=+n;state.tab='study';render();const el=document.getElementById(h);if(el)el.scrollIntoView();return}
  else state.view='home';
  render();window.scrollTo(0,0);
}
function render(){
  renderNav();
  $('#main').innerHTML=state.view==='home'?homeV():state.view==='scripture'?scriptureV():lessonV(byN[state.lesson]);
}

/* home */
function homeV(){
  const nd=L.filter(l=>studied[l.n]).length;
  return `<div class="eyebrow">Unlocking the Bible · Study Guide</div>
  <h1>Welcome! Study each lesson at your own pace.</h1>
  <p class="sub">Notes, scriptures explained, history behind the text, key points to practise, and a quiz for every lesson.</p>
  <div class="hero" style="margin-top:20px">
    <div class="card"><h3>The story of the Bible in Ages</h3>
      <p class="muted" style="margin:6px 0 4px">Tap an Age to see which lessons cover it.</p>
      <div class="ages">${AGES.map((a,i)=>`<button class="age ${ageFilter===i?'on':''}" onclick="ageFilter=ageFilter===${i}?null:${i};render()">${i+1}. ${a}</button>`).join('')}</div>
      <h3 style="margin-top:18px">The golden thread: the Lamb</h3>
      <div class="thread">${THREAD.map(t=>`<div class="tstep" style="cursor:pointer" onclick="go('lesson-${t[2]}')"><b>${t[1]}</b><span class="muted">${t[0]} · L${t[2]}</span></div>`).join('')}</div>
    </div>
    <div class="card"><h3>Your progress</h3>
      <p class="muted" style="margin:6px 0 10px">${nd} of ${L.length} lessons studied.</p>
      <div class="bar"><i style="width:${nd/L.length*100}%"></i></div>
      <p style="margin:16px 0 6px"><b>How to use this guide</b></p>
      <ul class="clean"><li><b>Study</b> — read the lesson notes. Open “Go deeper” for the meaning and history behind each passage.</li><li>Tap any <span class="ref" style="margin:0">scripture</span> for an explanation.</li><li><b>Key points</b> — practise filling in the blanks from your handout.</li><li><b>Charts</b> — every chart from class, full screen.</li><li><b>Quiz</b> — check what you remember.</li></ul>
    </div>
  </div>
  <h2>Biblical timeline</h2>${figHtml(byN[2],[byN[2].charts[0]],true)}
  <h2>Lessons</h2>
  <div class="grid g3">${L.map(l=>{const dim=ageFilter!==null&&!(AGEMAP[l.n]||[]).includes(ageFilter);return `<div class="card lcard ${dim?'dim':''}" onclick="go('lesson-${l.n}')">${studied[l.n]?'<span class="tick">✓ studied</span>':''}<div class="n">Lesson ${l.n}</div><h3>${esc(l.title)}</h3><p>${esc(l.sub)}</p></div>`}).join('')}</div>
  <footer>Your progress and notes are saved only in this browser on this device.</footer>`;
}

/* lesson */
function lessonV(l){
  const i=L.indexOf(l);
  let h=`<div class="row" style="justify-content:space-between"><div class="eyebrow">Lesson ${l.n} · ${esc(l.age)}</div>
   <button class="btn ${studied[l.n]?'teal':'ghost'}" onclick="toggleStudied(${l.n})">${studied[l.n]?'✓ Studied':'Mark as studied'}</button></div>
   <h1 style="margin-top:6px">${esc(l.title)}</h1><p class="sub">${esc(l.sub)}</p>
   <div class="tabs">${TABS.map(([k,t])=>`<button class="${state.tab===k?'on':''}" onclick="setTab('${k}')">${t}</button>`).join('')}</div>`;
  h+=({study:studyV,charts:chartsV,keys:keysV,words:wordsV,background:bgV,qa:qaV,quiz:quizV,notes:notesV}[state.tab])(l);
  h+=`<div class="row" style="justify-content:space-between;margin-top:36px">${i>0?`<button class="btn ghost" onclick="go('lesson-${L[i-1].n}')">← Lesson ${L[i-1].n}</button>`:'<span></span>'}${i<L.length-1?`<button class="btn ghost" onclick="go('lesson-${L[i+1].n}')">Lesson ${L[i+1].n} →</button>`:''}</div>`;
  return h;
}
function setTab(t){state.tab=t;history.replaceState(null,'','#lesson-'+state.lesson+(t==='study'?'':'-'+t));render();window.scrollTo(0,0)}
function toggleStudied(n){studied[n]=!studied[n];store.set('studied',studied);render();toast(studied[n]?'Marked as studied':'Unmarked')}
function studyV(l){
  return `<div class="card"><div class="eyebrow">Big idea</div><p class="big" style="margin:6px 0 0">${esc(l.bigIdea)}</p>
   <p style="margin:12px 0 0"><span class="pill">Age: ${esc(l.age)}</span><span class="pill">People: ${esc(l.cast)}</span></p></div>
  <div class="card" style="margin-top:14px"><h3>By the end of this lesson you should be able to…</h3><ul class="clean">${l.objectives.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></div>
  <div class="jump" style="margin-top:16px">${l.flow.map((f,i)=>`<a href="#s-${l.n}-${i}" onclick="event.preventDefault();document.getElementById('s-${l.n}-${i}').scrollIntoView({behavior:'smooth'})">${esc(f.s)} · ${esc(f.t)}</a>`).join('')}</div>
  ${l.flow.map((f,i)=>`<div class="card sec" id="s-${l.n}-${i}">
    <div class="sl"><span class="sx">${esc(f.s)}</span><h2 style="margin:0 0 6px">${esc(f.t)}</h2></div>
    <ul class="clean">${f.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
    <div style="margin-top:10px"><b style="font-size:12px;letter-spacing:.08em" class="muted">READ:</b> ${f.refs.map(r=>`<button class="ref" onclick="openRef('${esc(r)}',${l.n},${i})">${esc(r)}</button>`).join('')}</div>
    ${secCharts(l,i)}
    <details class="deeper"><summary>Go deeper — meaning & history</summary>
      <div class="layer l-ex"><h4>What the text means</h4><p>${esc(f.explain)}</p></div>
      <div class="layer l-ctx"><h4>Historical & cultural background</h4><p>${esc(f.ctx)}</p></div>
    </details>
    <div class="layer l-eg"><h4>Picture it</h4><p>${esc(f.ex)}</p></div>
    <div class="layer l-ask"><h4>Think about it</h4><p>${esc(f.ask)}</p></div>
    ${f.key?`<div class="keybox"><small>Key #${f.key} · tap the blanks to reveal</small>${keyHtml(l.keys[f.key-1],'reveal',f.key)}</div>`:''}
  </div>`).join('')}
  <div class="card" style="margin-top:16px"><h3>Reflection</h3><ol class="clean"><li>What stood out to you in this lesson?</li><li>What is one personal action step you will take this week?</li></ol>
   <p class="muted" style="margin:10px 0 0">Write your answers in <a href="javascript:void 0" onclick="setTab('notes')">My notes</a>.</p></div>
  <div class="card" style="margin-top:14px"><h3>Coming up</h3><p style="margin:6px 0 0">${esc(l.bridge)}</p></div>`;
}
function normBook(r){const m=r.match(/^((?:\d\s)?[A-Za-z][A-Za-z ]*?)\s+\d/);return m?m[1]:r}
function openRef(ref,n,i){
  const l=byN[n],f=l.flow[i];
  const ch=ref.split(' ').pop().split(':')[0];
  const others=[];L.forEach(x=>x.flow.forEach((g,j)=>{if(!(x.n===n&&j===i)&&g.refs.some(r=>normBook(r)===normBook(ref)&&r.split(' ').pop().split(':')[0]===ch))others.push({x,g,j})}));
  $('#drawerBody').innerHTML=`<div class="eyebrow">Scripture</div><h2 style="margin:6px 0 4px">${esc(ref)}</h2>
   <p class="muted" style="margin:0 0 14px">Lesson ${n} · ${esc(f.t)}</p>
   <p><a href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(ref)}&version=NKJV" target="_blank" rel="noopener">Read ${esc(ref)} (NKJV) ↗</a></p>
   <div class="layer l-ex"><h4>What it means here</h4><p>${esc(f.explain)}</p></div>
   <div class="layer l-ctx"><h4>Background</h4><p>${esc(f.ctx)}</p></div>
   ${others.length?`<h3 style="margin-top:18px">Also in</h3>${others.map(o=>`<div class="hit" onclick="closeDrawer();go('s-${o.x.n}-${o.j}')">Lesson ${o.x.n} · ${esc(o.g.t)}</div>`).join('')}`:''}`;
  $('#drawer').classList.add('open');
}
function closeDrawer(){$('#drawer').classList.remove('open')}
function keyHtml(k,mode,idx){let j=0;return esc(k).replace(/\[([^\]]+)\]/g,(m,w)=>{const id=`${idx}_${j++}`;
  if(mode==='reveal')return `<span class="reveal" onclick="this.classList.toggle('shown')">${w}</span>`;
  if(mode==='type')return `<input class="blank" data-a="${esc(w)}" size="${Math.max(6,w.length)}" oninput="checkBlank(this)" autocomplete="off" aria-label="blank">`;
  return `<b style="color:var(--accent2)">${w}</b>`;})}
function keysV(l){
  return `<div class="row" style="justify-content:space-between"><p class="muted" style="margin:0">These are the key statements from your handout. Practise until you can fill them all in.</p>
  <div class="toggles">${[['type','Type the blanks'],['reveal','Tap to reveal'],['answer','Show answers']].map(([k,t])=>`<label><input type="radio" name="km" ${keyMode===k?'checked':''} onchange="keyMode='${k}';render()"> ${t}</label>`).join('')}</div></div>
  <div class="card" style="margin-top:14px">${l.keys.map((k,i)=>`<div class="keyrow"><div class="kn">#${i+1}</div><div class="kt">${keyHtml(k,keyMode,i)}</div></div>`).join('')}
  ${keyMode==='type'?`<p class="muted" style="margin:12px 0 0" id="kscore">Type each missing word — it turns green when correct.</p>`:''}</div>
  <h2>Keys chart</h2>${figHtml(l,l.charts.filter(c=>c.sec===-1),true)}`;
}
function checkBlank(el){const n=s=>s.toLowerCase().replace(/[’'.,]/g,'').replace(/\s+/g,' ').trim();const a=n(el.dataset.a),v=n(el.value);el.classList.toggle('right',v===a);el.classList.toggle('wrong',v.length>=a.length&&v!==a);
  const all=[...document.querySelectorAll('.blank')],r=all.filter(b=>b.classList.contains('right')).length;const s=$('#kscore');if(s)s.textContent=r===all.length?`All ${r} correct — well done!`:`${r} of ${all.length} correct`}
function wordsV(l){
  return `<div class="toggles" style="margin-bottom:12px">${[['cards','Flip cards'],['table','Table']].map(([k,t])=>`<label><input type="radio" name="wv" ${wordView===k?'checked':''} onchange="wordView='${k}';render()"> ${t}</label>`).join('')}</div>`+
  (wordView==='cards'?`<div class="grid g3">${l.words.map(w=>`<div class="flip" onclick="this.classList.toggle('f')"><div class="in"><div class="fa"><span class="muted" style="font-size:12px">${esc(w[1])}</span><b>${esc(w[0])}</b><span class="muted" style="font-size:12px;margin-top:6px">tap to flip</span></div><div class="fb"><b>${esc(w[2])}</b><span style="font-size:13px;margin-top:6px;opacity:.85">${esc(w[3])}</span></div></div></div>`).join('')}</div>`
  :`<div class="card"><table class="words"><tr><th>Word</th><th>Original</th><th>Meaning</th><th>Note</th></tr>${l.words.map(w=>`<tr><td><b>${esc(w[0])}</b></td><td>${esc(w[1])}</td><td>${esc(w[2])}</td><td class="muted">${esc(w[3])}</td></tr>`).join('')}</table></div>`);
}
function bgV(l){return l.background.map((b,i)=>`<details ${i===0?'open':''}><summary>${esc(b[0])}</summary><p>${esc(b[1])}</p></details>`).join('')+
  `<h2>Background for each section</h2>`+l.flow.map(f=>`<details><summary>${esc(f.s)} · ${esc(f.t)}</summary><p>${esc(f.ctx)}</p></details>`).join('')}
function qaV(l){return `<p class="muted" style="margin-top:0">Questions people often ask about this lesson. Bring any others to class!</p>`+l.qa.map(q=>`<details><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join('')+
  `<h2>Questions to think about</h2><div class="card"><ol class="clean">${l.flow.map(f=>`<li>${esc(f.ask)}</li>`).join('')}</ol></div>`}
function quizV(l){
  const s=qz[l.n]||(qz[l.n]={i:0,score:0,ans:null});
  if(s.i>=l.quiz.length){const best=store.get('best_'+l.n,0);if(s.score>best)store.set('best_'+l.n,s.score);
    return `<div class="card" style="text-align:center;padding:36px"><div class="eyebrow">Quiz complete</div><h1 style="margin:10px 0">${s.score} / ${l.quiz.length}</h1><p class="muted">${s.score===l.quiz.length?'Perfect score!':'Review the Study tab and try again.'} Best: ${Math.max(best,s.score)}/${l.quiz.length}</p><button class="btn" onclick="qz[${l.n}]=null;render()">Try again</button></div>`}
  const q=l.quiz[s.i];
  return `<div class="card"><div class="row" style="justify-content:space-between"><span class="eyebrow">Question ${s.i+1} of ${l.quiz.length}</span><span class="pill">Score ${s.score}</span></div>
  <h3 style="margin:10px 0 8px;font-size:20px">${esc(q[0])}</h3>
  ${q[1].map((o,i)=>`<button class="opt ${s.ans!==null?(i===q[2]?'right':(i===s.ans?'wrong':'')):''}" ${s.ans!==null?'disabled':''} onclick="answer(${l.n},${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}
  ${s.ans!==null?`<div class="why"><b>${s.ans===q[2]?'Correct!':'Not quite.'}</b> ${esc(q[3])}</div><div style="text-align:right;margin-top:12px"><button class="btn" onclick="qz[${l.n}].i++;qz[${l.n}].ans=null;render()">Next →</button></div>`:''}</div>`;
}
function answer(n,i){const s=qz[n],q=byN[n].quiz[s.i];s.ans=i;if(i===q[2])s.score++;render()}
function notesV(l){const v=store.get('notes_'+l.n,'');return `<p class="muted" style="margin-top:0">Your own notes and reflection answers. Saved in this browser only.</p><textarea id="nt" placeholder="What stood out to me… My action step this week…" oninput="store.set('notes_${l.n}',this.value)">${esc(v)}</textarea>
 <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="copyNotes()">Copy notes</button></div>`}
function copyNotes(){const t=$('#nt').value;navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Select the text and copy manually'))}
function scriptureV(){
  const map={};L.forEach(l=>l.flow.forEach((f,i)=>f.refs.forEach(r=>{const b=normBook(r);(map[b]=map[b]||[]).push({r,l,f,i})})));
  const order=Object.keys(map).sort((a,b)=>(BOOKS.indexOf(a)+1||99)-(BOOKS.indexOf(b)+1||99));
  return `<div class="eyebrow">Scripture index</div><h1>Every passage in the course</h1><p class="sub">In Bible order. Tap one for its explanation.</p>
  <div class="card" style="margin-top:16px"><div class="row">${order.map(b=>`<a href="javascript:void 0" class="pill" onclick="document.getElementById('bk-${b.replace(/\s/g,'')}').scrollIntoView({behavior:'smooth'})">${b}</a>`).join('')}</div></div>
  ${order.map(b=>`<h2 id="bk-${b.replace(/\s/g,'')}">${b}</h2><div class="card">${map[b].map(x=>`<div class="row" style="padding:5px 0;border-bottom:1px dashed var(--line)"><button class="ref" onclick="openRef('${esc(x.r)}',${x.l.n},${x.i})">${esc(x.r)}</button><span class="muted" style="font-size:13.5px">L${x.l.n} · ${esc(x.f.t)}</span></div>`).join('')}</div>`).join('')}`;
}
function doSearch(q){
  q=q.trim();if(q.length<2){route();return}
  const re=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),rx=new RegExp(re,'i'),hits=[];
  const add=(l,where,text,act)=>{const m=text.search(rx);if(m<0)return;const s=Math.max(0,m-60);hits.push({l,where,snip:(s?'…':'')+text.slice(s,m+120),act})};
  L.forEach(l=>{add(l,'Big idea',l.title+' — '+l.bigIdea,`go('lesson-${l.n}')`);
   l.flow.forEach((f,i)=>add(l,f.s+' · '+f.t,[f.t,...f.pts,f.refs.join(' '),f.explain,f.ctx,f.ex,f.ask].join(' • '),`go('s-${l.n}-${i}')`));
   l.qa.forEach(x=>add(l,'Questions',x[0]+' — '+x[1],`go('lesson-${l.n}-qa')`));
   l.background.forEach(x=>add(l,'Background',x[0]+' — '+x[1],`go('lesson-${l.n}-background')`));
   l.words.forEach(x=>add(l,'Word studies',x.join(' — '),`go('lesson-${l.n}-words')`));});
  $('#main').innerHTML=`<div class="eyebrow">Search</div><h1>“${esc(q)}”</h1><p class="sub">${hits.length} result${hits.length===1?'':'s'}</p><div class="card" style="margin-top:14px">${hits.slice(0,80).map(h=>`<div class="hit" onclick="${h.act}"><b>Lesson ${h.l.n}</b> <span class="muted">· ${esc(h.where)}</span><div style="font-size:14px">${esc(h.snip).replace(new RegExp('('+re+')','ig'),'<mark>$1</mark>')}</div></div>`).join('')||'<p class="muted">No matches.</p>'}</div>`;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
$('#q').addEventListener('input',e=>{clearTimeout(window._sq);window._sq=setTimeout(()=>doSearch(e.target.value),200)});
$('#menuBtn').onclick=()=>{$('#side').classList.toggle('open');document.body.classList.toggle('menuopen',$('#side').classList.contains('open'))};
/* swipe for presenter and chart viewer */
(function(){let x0=null,y0=null;document.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY},{passive:true});
document.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.5)return;const d=dx<0?1:-1;
 if($('#lb').classList.contains('open'))stepLB(d);else if($('#pres')&&$('#pres').classList.contains('open'))presStep(d)},{passive:true})})();


function setNav(h){document.body.classList.toggle('navhidden',h);store.set('navhidden',h)}
setNav(store.get('navhidden',false));
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='\\'){e.preventDefault();setNav(!document.body.classList.contains('navhidden'))}});
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
