<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlocking the Bible — Student Study Guide</title>
<meta name="description" content="Study guide for the Unlocking the Bible course: lesson notes, scriptures explained, key points practice, word studies and quizzes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfd; --paper:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --faint:#86868b; --line:#e8e8ed;
  --accent:#0071e3; --accent2:#0071e3; --gold:#1d1d1f; --soft:#f5f5f7; --ok:#1d8a4e; --bad:#d70015;
  --shadow:0 1px 1px rgba(0,0,0,.02),0 6px 24px rgba(0,0,0,.04);
  --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:#cfe3fb}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{background:rgba(245,245,247,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-right:1px solid var(--line);color:var(--ink);padding:26px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:0 10px}
.brand small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px}
.navsec{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--faint);margin:22px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:7px 10px;border-radius:9px;font-size:14px;color:var(--ink);transition:background .15s}
.nav button:hover{background:rgba(0,0,0,.04)}
.nav button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:500}
.num{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:transparent;color:var(--faint);border:1px solid #d2d2d7}
.nav button.on .num{background:var(--accent);border-color:var(--accent);color:#fff}
.num.done{background:var(--ok);border-color:var(--ok);color:#fff}
.nav .lt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{width:100%;padding:8px 12px;border-radius:10px;border:0;background:rgba(0,0,0,.05);color:var(--ink);margin-top:18px;font:inherit;font-size:14px;outline:none;transition:background .15s, box-shadow .15s}
.search:focus{background:#fff;box-shadow:0 0 0 3px rgba(0,113,227,.25)}
.search::placeholder{color:var(--faint)}

/* main */
main{padding:56px clamp(20px,5vw,72px) 100px;max-width:1080px;width:100%;min-width:0;margin:0 auto}
.mobilebar{display:none}
h1,h2,h3{font-family:var(--serif);line-height:1.12;margin:0;letter-spacing:-.025em;font-weight:600}
h1{font-size:clamp(32px,4.4vw,48px);font-weight:700;letter-spacing:-.035em}
h2{font-size:24px;margin:44px 0 16px}
h3{font-size:17px;letter-spacing:-.015em}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:-.005em;text-transform:none}
.sub{color:var(--muted);font-size:19px;line-height:1.45;margin:10px 0 0;letter-spacing:-.015em;max-width:720px}
.card{background:var(--paper);border:0;border-radius:var(--r);padding:24px 26px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;background:var(--soft);color:var(--muted);font-size:12.5px;font-weight:500;margin:2px 4px 2px 0}

/* segmented tabs */
.tabs{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:30px 0 26px;position:sticky;top:12px;z-index:5;background:rgba(232,232,237,.7);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:3px;border-radius:12px;width:fit-content;max-width:100%}
.tabs button{white-space:nowrap;background:none;border:0;padding:6px 12px;border-radius:9px;color:var(--ink);font-weight:500;font-size:13.5px;transition:all .15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}

.btn{background:var(--accent);color:#fff;border:0;border-radius:980px;padding:9px 18px;font-weight:500;font-size:14px;transition:background .15s, opacity .15s}
.btn:hover{background:#0077ed}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.ghost:hover{background:#ebebf0}
.btn.teal{background:var(--ok)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--serif);font-size:24px;line-height:1.4;font-weight:600;letter-spacing:-.022em}
ul.clean,ol.clean{margin:8px 0 0;padding-left:20px}
ul.clean li,ol.clean li{margin:6px 0}
ul.clean li::marker{color:var(--faint)}
.muted{color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:stretch}
.ages{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.age{border:0;background:var(--soft);border-radius:980px;padding:6px 14px;font-size:13px;font-weight:500;transition:all .15s}
.age:hover{background:#ebebf0}
.age.on{background:var(--ink);color:#fff}
.lcard{cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;position:relative;padding:26px}
.lcard:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.03),0 16px 40px rgba(0,0,0,.08)}
.lcard.dim{opacity:.3}
.lcard .n{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--faint);line-height:1;letter-spacing:0}
.lcard h3{margin:14px 0 6px;font-size:19px}
.lcard p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.tick{position:absolute;top:22px;right:22px;font-size:12px;color:var(--ok);font-weight:500}
.thread{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px;padding:8px 0 0}
.tstep{text-align:left;padding:10px 12px;border-radius:12px;font-size:12px;transition:background .15s}
.tstep:hover{background:var(--soft)}
.tstep b{display:block;font-family:var(--serif);font-size:14px;font-weight:600;letter-spacing:-.015em;color:var(--ink);margin-bottom:2px}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .4s}

/* teach */
.secnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.secnav button{border:0;background:var(--soft);border-radius:980px;min-width:34px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.secnav button.on{background:var(--ink);color:#fff}
.secnav button.done{color:var(--ok)}
.secnav button.on.done{background:var(--ok);color:#fff}
.sechead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;padding:5px 12px;border-radius:980px;background:var(--soft);color:var(--muted)}
.timer.over{background:#fde8ea;color:var(--bad)}
.layer{border:0;padding:16px 18px;margin:12px 0;border-radius:14px;background:var(--soft)}
.layer h4{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none}
.layer p{margin:0;color:#333336}
.l-ex h4{color:var(--accent)}
.l-ctx h4{color:#8e5b00}
.l-eg h4{color:#6e6e73}
.l-ask h4{color:#7a3fc2}
.keybox{background:linear-gradient(180deg,#f2f7ff,#eaf2fe);color:var(--ink);border-radius:16px;padding:18px 20px;margin-top:16px;font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:-.018em;line-height:1.5}
.keybox small{display:block;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--accent);margin-bottom:4px}
.keybox .reveal{background:#d6e6fb}
.ref{display:inline-block;border:0;background:var(--soft);padding:4px 11px;border-radius:980px;font-size:13px;margin:3px 4px 3px 0;color:var(--accent);font-weight:500;transition:background .15s}
.ref:hover{background:#e6effc}
.toggles{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.toggles label{display:flex;gap:6px;align-items:center;background:var(--soft);border:0;border-radius:980px;padding:5px 12px;cursor:pointer;color:var(--ink)}
.toggles input{accent-color:var(--accent);margin:0}
input[type=checkbox]{accent-color:var(--accent)}

/* keys */
.keyrow{display:flex;gap:18px;align-items:flex-start;padding:20px 0;border-bottom:1px solid var(--line)}
.keyrow:last-child{border-bottom:0}
.keyrow .kn{font-family:var(--serif);font-weight:600;color:var(--faint);font-size:15px;min-width:28px;padding-top:4px}
.keyrow .kt{font-family:var(--serif);font-size:21px;line-height:1.6;font-weight:500;letter-spacing:-.02em}
.blank{display:inline-block;min-width:70px;border:0;border-bottom:2px solid #d2d2d7;background:transparent;font:inherit;color:var(--accent);text-align:center;padding:0 4px;margin:0 2px;outline:none;transition:border-color .15s}
.blank:focus{border-color:var(--accent)}
.blank.right{border-color:var(--ok);color:var(--ok)}
.blank.wrong{border-color:var(--bad);color:var(--bad)}
.reveal{color:transparent;background:#ececf0;border-radius:6px;padding:0 8px;cursor:pointer;user-select:none;transition:all .2s}
.reveal.shown{color:var(--accent);background:transparent}

/* flip cards */
.flip{perspective:1000px;height:160px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.f .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.flip .fa{background:var(--paper)}
.flip .fa b{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.025em}
.flip .fb{background:var(--ink);color:#fff;transform:rotateY(180deg)}
.flip .fb b{font-size:17px;font-weight:600}

/* accordions */
details{background:var(--paper);border:0;border-radius:14px;margin:8px 0;padding:0 20px;box-shadow:var(--shadow)}
summary{cursor:pointer;padding:16px 0;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary:before{content:none}
summary:after{content:"";flex:none;width:8px;height:8px;margin-top:7px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(45deg);transition:transform .2s}
details[open] summary:after{transform:rotate(-135deg);margin-top:10px}
details p{margin:0 0 18px;color:#333336}

/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:14px;padding:13px 16px;margin:8px 0;font-size:15.5px;transition:all .15s}
.opt:hover:not(:disabled){background:#ebebf0}
.opt.right{border-color:var(--ok);background:#eaf6ef}
.opt.wrong{border-color:var(--bad);background:#fdecee}
.why{margin-top:12px;padding:14px 16px;background:var(--soft);border-radius:14px}

/* accuracy */
.acc{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc .ic{flex:none;width:22px;height:22px;border-radius:50%;background:#fff4e0;color:#8e5b00;display:grid;place-items:center;font-weight:700;font-size:12px}
textarea{width:100%;min-height:280px;border:0;border-radius:var(--r);padding:20px;font:inherit;background:var(--paper);resize:vertical;box-shadow:var(--shadow);outline:none}
textarea:focus{box-shadow:0 0 0 3px rgba(0,113,227,.2)}
table.words{width:100%;border-collapse:collapse;font-size:14.5px}
table.words td,table.words th{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.words th{font-weight:600;color:var(--muted);font-size:12.5px}

/* drawer (sheet) */
.drawer{position:fixed;right:12px;top:12px;bottom:12px;width:min(440px,calc(100% - 24px));background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.18);transform:translateX(calc(100% + 24px));transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:30;padding:28px;overflow:auto}
.drawer.open{transform:none}
.x{position:absolute;right:16px;top:16px;background:var(--soft);border:0;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}

/* presenter (keynote style) */
.pres{position:fixed;inset:0;background:#000;color:#f5f5f7;z-index:50;display:none;flex-direction:column;padding:4vh 7vw}
.pres.open{display:flex}
.pres .ptop{display:flex;justify-content:space-between;align-items:center;color:#86868b;font-size:13px}
.pres .pbody{flex:1;display:flex;flex-direction:column;justify-content:center}
.pres h2{font-size:clamp(34px,5vw,64px);margin:0 0 4vh;color:#fff;font-weight:700;letter-spacing:-.035em}
.pres li{font-size:clamp(19px,2.3vw,30px);margin:1.4vh 0;opacity:0;transform:translateY(10px);transition:all .45s cubic-bezier(.2,.8,.2,1);color:#e8e8ed}
.pres li.v{opacity:1;transform:none}
.pres .pkey{font-family:var(--serif);font-size:clamp(28px,3.8vw,52px);line-height:1.3;font-weight:600;letter-spacing:-.03em}
.pres .pkey .reveal{color:transparent;background:#2c2c2e}
.pres .pkey .reveal.shown{color:#2997ff;background:none}
.pres .pnav{display:flex;gap:10px;justify-content:center}
.pres .btn.ghost{background:#1d1d1f;color:#f5f5f7}
.pres .eyebrow{color:#2997ff!important}

.hit{padding:14px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;transition:background .15s}
.hit:last-child{border-bottom:0}
.hit:hover{background:var(--soft)}
.hit mark{background:#fff1b8;border-radius:3px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(29,29,31,.88);backdrop-filter:blur(20px);color:#fff;padding:10px 18px;border-radius:980px;font-size:14px;opacity:0;transition:all .25s;z-index:60;pointer-events:none}
.toast.s{opacity:1;transform:translateX(-50%)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:40;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);background:rgba(245,245,247,.96)}
  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.15)}
  .mobilebar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(251,251,253,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);color:var(--ink);padding:12px 16px;z-index:20;border-bottom:1px solid var(--line)}
  .mobilebar button{background:none;border:0;font-size:20px;color:var(--ink)}
  .mobilebar b{font-family:var(--sans)!important;font-weight:600;font-size:15px}
  .hero{grid-template-columns:1fr}
  main{padding:28px 18px 80px}
  .tabs{top:58px;overflow-x:auto;flex-wrap:nowrap;width:100%}
  .tabs button{white-space:nowrap}
  .card{padding:20px}
}
@media print{.side,.tabs,.mobilebar,.btn,.toggles,.secnav{display:none!important}.app{display:block}.card{box-shadow:none}}

/* charts */
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:18px 0 4px}
.fig{margin:0;cursor:zoom-in;border-radius:14px;overflow:hidden;background:var(--soft);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.fig:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.1)}
.fig img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#ececf0}
.fig figcaption{padding:10px 14px 12px;font-size:13px;line-height:1.4;color:var(--ink)}
.fig figcaption span{display:block;color:var(--faint);font-size:11.5px;font-weight:500;margin-bottom:2px}
.figs.one{grid-template-columns:minmax(0,1fr)}
.figs.one .fig img{aspect-ratio:auto}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;padding:56px 70px 70px}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb .cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#f5f5f7;font-size:14px}
.lb .cap span{color:#86868b;margin-right:8px}
.lb .lbx,.lb .lbp,.lb .lbn{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px;display:grid;place-items:center;transition:background .15s}
.lb .lbx:hover,.lb .lbp:hover,.lb .lbn:hover{background:rgba(255,255,255,.24)}
.lb .lbx{top:14px;right:14px}
.lb .lbp{left:14px;top:50%;transform:translateY(-50%)}
.lb .lbn{right:14px;top:50%;transform:translateY(-50%)}
.lb .cnt{position:absolute;top:24px;left:0;right:0;text-align:center;color:#86868b;font-size:13px}
@media (max-width:860px){.lb{padding:60px 8px 70px}.lb .lbp,.lb .lbn{top:auto;bottom:12px;transform:none}}

/* hide / show side menu */
.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.hidebtn{flex:none;border:0;background:transparent;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);margin-top:-2px;transition:background .15s}
.hidebtn:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.hidebtn svg,.showbtn svg{width:18px;height:18px}
.showbtn{display:none;position:fixed;top:16px;left:16px;z-index:25;border:0;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.06);color:var(--ink);place-items:center}
.showbtn:hover{background:#fff}
@media (min-width:861px){
  body.navhidden .app{grid-template-columns:minmax(0,1fr)}
  body.navhidden .side{display:none}
  body.navhidden .showbtn{display:grid}
}
@media (max-width:860px){.hidebtn{display:none}}

/* presenter: chart & reflection slides */
.pres .pchartwrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
.pres .pchart{max-width:100%;max-height:66vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6);cursor:zoom-in}
.pres .pcap{color:#86868b;font-size:clamp(14px,1.3vw,18px)}
.pres .pcap b{color:#f5f5f7;font-weight:500}
.pres ol.pref{padding-left:1.2em;margin:0}
.pres ol.pref li{font-size:clamp(24px,3vw,42px);font-weight:600;letter-spacing:-.025em;line-height:1.3;margin:3vh 0}
.pres .pprog{color:#86868b;font-size:13px;margin-right:6px}

/* ---------- responsive polish ---------- */
.scrim{display:none}
.tabs{-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
img{max-width:100%}
@media (hover:none){.lcard:hover,.fig:hover{transform:none}}
@media (max-width:860px){
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:35;opacity:0;pointer-events:none;transition:opacity .25s;display:block}
  .side.open~.scrim,body.menuopen .scrim{opacity:1;pointer-events:auto}
  .search,textarea,input.blank{font-size:16px}
  .tabs{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);padding-right:24px}
  .big{font-size:20px}
  h2{font-size:21px;margin:34px 0 12px}
  .sec{padding:22px 20px}
  .sec h2{font-size:21px}

<script>
const L=[{"n":1,"title":"The Bible: God’s Word","sub":"What the Bible is, why we can trust it, and how to respond to it","age":"Introduction (before the Ages)","cast":"The authors of Scripture — and you, the reader","bigIdea":"The Bible is God’s inspired, reliable Word, given so we can know and experience Him — and it must be read, understood and applied.","objectives":["Explain what the Bible is","List the benefits of studying the Word of God","Examine evidences and conclude the Bible is reliable and true","Show a desire to know and understand God’s Word"],"flow":[{"s":"A","t":"The Journey of the Bible","pts":["Before Scripture was written, God spoke through nature, dreams, visions, angels and symbols (Heb 1:1).","The written Word began with Moses at Sinai — the covenant written on stone, kept in the Ark of the Covenant.","Moses wrote the law and commanded it be read publicly every 7 years at the Feast of Tabernacles (Deut 31:9-11)."],"refs":["Hebrews 1:1","Deuteronomy 31:9-11"],"explain":"Hebrews 1:1-2 contrasts “various ways” in the past with God’s final word “by His Son.” Revelation is progressive: each stage builds on the last, climaxing in Jesus. Deut 31 shows that from the start, God’s Word was meant to be heard by everyone — men, women, children and foreigners (v.12) — not kept by a priestly elite.","ctx":"Writing materials changed over the centuries: stone, clay tablets, wooden boards coated with wax, leather scrolls, papyrus (made from Nile reeds) and later parchment (treated animal skin). Jewish scribes (sopherim, later the Masoretes, c. AD 500–1000) counted letters and words to catch copying errors — a scroll with mistakes was buried, not used.","ex":"Illustrate with a relay race: God handed His Word from Moses to prophets to scribes to translators — and now to us. Our job is not to drop the baton.","ask":"Why do you think God chose to put His Word in writing rather than only speaking in dreams and visions?"},{"s":"B","t":"Arrangement of the Bible","pts":["“Bible” comes from Latin/Greek biblia = “books” — a library of 66 books.","Old Testament (39): Law (Genesis–Deuteronomy), History (Joshua–Esther), Poetry (Job–Song of Solomon), Major Prophets (Isaiah–Daniel), Minor Prophets (Hosea–Malachi).","New Testament (27): Gospels, Acts, Epistles (Romans–Jude), Prophecy (Revelation).","Chapters and verses were added later for reference: Book → Chapter → Verse (e.g., Genesis 1:1)."],"refs":["Genesis 1:1"],"explain":"“Testament” means covenant. The Bible is literally “the Old Covenant” and “the New Covenant” — a relationship story, not just a rulebook. “Minor” prophets are minor only in length, not importance.","ctx":"Chapter divisions are credited to Stephen Langton, Archbishop of Canterbury (c. 1227). Verse numbers: OT verses were fixed by Jewish scholars; NT verses were added by printer Robert Estienne (Stephanus) in 1551 — reportedly while travelling. The first English Bible with full chapters and verses was the Geneva Bible (1560).","ex":"Do a 60-second “sword drill”: call out John 3:16, Psalm 23:1, Romans 3:23. First to read it aloud wins.","ask":"Which section of the Bible do you think you’d enjoy reading first, and why?"},{"s":"C","t":"The Bible is God’s Word (Inspiration)","pts":["2 Timothy 3:16 — all Scripture is “given by inspiration of God” (God-breathed).","Phrases like “The LORD said” / “God spoke” appear thousands of times.","Paul (1 Cor 14:37) and Jeremiah (Jer 30:1-2) both wrote what God told them."],"refs":["2 Timothy 3:16","1 Corinthians 14:37","Jeremiah 30:1-2","2 Peter 1:20-21"],"explain":"Greek theopneustos = “God-breathed” (theos God + pneō to breathe). The same breath that made Adam a living soul (Gen 2:7) breathes life into Scripture. 2 Peter 1:21 adds that the writers were “moved” (pheromenoi — the word for a ship carried along by the wind, Acts 27:15) by the Holy Spirit. The writers kept their personality and style, but God carried the message.","ctx":"Over 40 human authors — shepherds, kings, fishermen, a doctor (Luke), a tax collector (Matthew), a tent-maker (Paul) — writing over ~1,500 years on three continents, in three languages (Hebrew, Aramaic, Greek), yet telling one unified story of redemption.","ex":"Illustration: a pianist plays a song on different pianos — each instrument sounds a bit different, but it’s the same composer’s song.","ask":"What would make 40 writers over 1,500 years agree on one storyline?","key":1},{"s":"D","t":"Facts about this Amazing Book (Evidences)","pts":["Scientific: “circle of the earth” (Isa 40:22); stars innumerable (Jer 33:22); earth hangs on nothing (Job 26:7).","Medical: “life of the flesh is in the blood” (Lev 17:11) vs. bloodletting that hastened George Washington’s death (1799).","Historical: worldwide flood stories; Tel Dan Stela (“House of David”); Pool of Siloam (John 9); Dead Sea Scrolls (1947).","Textual: the New Testament has far more manuscripts, far closer to the originals, than any other ancient book.","Prophetic: Israel reborn as a nation (1948); Jesus fulfilled the Messianic prophecies (Peter Stoner’s probability study)."],"refs":["Isaiah 40:22","Jeremiah 33:22","Job 26:7","Leviticus 17:11","Amos 9:14-15","Isaiah 66:7-8"],"explain":"The point is not to “prove God in a lab” but to show the Bible is not a book of myths — it is rooted in real places, real people and verifiable history. Isaiah 66:8 asks “Shall a nation be born at once?” — read it beside the events of 14 May 1948.","ctx":"Tel Dan Stela: found 1993–94 at Tel Dan in northern Israel; an Aramaic victory inscription (9th c. BC) mentioning the “House of David” — the first reference to King David outside the Bible. Pool of Siloam: uncovered by accident in 2004 during sewer repairs in Jerusalem. Dead Sea Scrolls: found 1946–47 by Bedouin shepherds in caves at Qumran; ~900 manuscripts; the Great Isaiah Scroll is about 1,000 years older than the previously oldest Hebrew copies, yet matches them very closely.","ex":"Time-gap illustration: draw a line from “Original” to “First copy.” For Caesar’s Gallic Wars it’s ~1,000 years and ~10 copies; for the NT it’s decades and thousands of copies. Ask: “Which would you trust more in a courtroom?”","ask":"Which evidence was most convincing to you? Which raised a question?","key":2},{"s":"E","t":"Faith","pts":["Evidence helps, but the Bible ultimately requires faith.","Faith comes by hearing the Word (Rom 10:17); without faith it is impossible to please God (Heb 11:6).","The Word must be “mixed with faith” to profit us (Heb 4:2).","God confirms His Word with signs (Mark 16:20)."],"refs":["Romans 10:17","Hebrews 11:6","Hebrews 4:2","Mark 16:20"],"explain":"Heb 4:2 uses a mixing image (sunkerannumi): like cement and water — separately useless, mixed together they become solid. The world says “prove it, then I’ll believe”; God says “believe Me, and I’ll prove it.”","ctx":"Hebrews was written to Jewish believers tempted to drift back to old ways under pressure. Chapter 11 (the “hall of faith”) shows people who trusted God before seeing the result.","ex":"A chair: you can study its engineering all day (evidence), but you only experience its support when you sit in it (faith).","ask":"Where in your life is God asking you to “sit in the chair”?","key":3},{"s":"F","t":"How God Views His Word","pts":["He magnifies His Word above His name (Ps 138:2).","It is living, powerful, sharper than a two-edged sword (Heb 4:12).","It does not return void (Isa 55:11).","It is truth (John 17:17) and it is everlasting (Matt 24:35)."],"refs":["Psalm 138:2","Hebrews 4:12","Isaiah 55:11","John 17:17","Matthew 24:35"],"explain":"Heb 4:12 — “living” (zōn) and “powerful” (energēs, the root of “energy”). The “two-edged sword” (machaira) was the short Roman dagger used for close combat: the Word gets close and personal. Isa 55:10-11 uses rain and snow: water never falls without producing something — neither does God’s Word.","ctx":"Ps 138:2 is a psalm of David; in Hebrew thought a person’s “name” is their reputation and character. God stakes His reputation on keeping His Word.","ex":"A promise from a friend is only as good as their character. God’s Word is backed by His whole name.","ask":"If God values His Word this highly, how highly should we value it?"},{"s":"G","t":"Benefits of the Word","pts":["Makes us wise (Ps 119:98-99).","Guides our life (Ps 119:133; Prov 3:5-6).","Reveals God’s plan for humanity (John 3:16).","Ultimately, lets us know and experience its Author (John 5:39)."],"refs":["Psalm 119:98-99","Psalm 119:133","Proverbs 3:5-6","John 3:16","John 5:39"],"explain":"John 5:39 is a warning: the Pharisees searched the Scriptures but missed the Person they pointed to. The Bible is not mainly a self-help manual (see the Michael Horton quote) — it is the revelation of Christ.","ctx":"Psalm 119 is an acrostic: 22 stanzas, one for each Hebrew letter, 8 verses each, all about God’s Word — the longest chapter in the Bible.","ex":"A love letter: you don’t read it just for facts; you read it to know the one who wrote it.","ask":"What is one area of life you want God’s Word to guide right now?","key":4},{"s":"H","t":"How Should I Respond? Read · Hear · Keep","pts":["READ — know the Word (Rev 1:3; Ps 119:33).","HEAR — understand it: no private interpretation (2 Pet 1:20); read in context, two or three witnesses; don’t add or subtract; study (2 Tim 2:15); ask the Holy Spirit (John 14:26).","KEEP — apply it: be doers, not hearers only (Jas 1:22); meditate day and night (Josh 1:8)."],"refs":["Revelation 1:3","Proverbs 2:1-5","2 Peter 1:20","Deuteronomy 19:15","Deuteronomy 4:2","2 Timothy 2:15","John 14:26","James 1:22","Joshua 1:8"],"explain":"2 Tim 2:15 “rightly dividing” (orthotomeō) = cutting straight, like a tent-maker (Paul’s trade) cutting leather along a straight line, or a road builder cutting a straight path. James 1:23-24 compares a hearer-only to someone who looks in a mirror and forgets what they saw. Joshua 1:8 “meditate” (hagah) = to murmur/mutter — reading Scripture under your breath, chewing on it.","ctx":"Revelation 1:3 is the only book that promises a blessing simply for reading it aloud and hearing it — in the first century most believers heard Scripture read in gatherings because few owned copies.","ex":"Try a simple plan: read 1 chapter of John a day for 21 days; write one sentence: “Today God told me…”","ask":"What will your daily Bible habit look like this week (time, place, plan)?","key":5}],"keys":["The Bible is the inspired [Word] of [God].","The Bible is [accurate] and [true].","God will [confirm] His Word when we have [faith].","The Bible is given to us to [know] and [experience] God.","The Bible is to be [read], [understood] and [applied]."],"words":[["Bible","Greek/Latin","biblia — “books”","A library, not a single book."],["Testament","Latin testamentum","Covenant","OT = Old Covenant; NT = New Covenant."],["Inspiration","Greek theopneustos","God-breathed","2 Tim 3:16."],["Canon","Greek kanōn","Measuring rod / standard","The books measured and accepted as Scripture."],["Meditate","Hebrew hagah","To murmur, mutter, ponder","Josh 1:8 — saying the Word to yourself."],["Rightly dividing","Greek orthotomeō","Cutting straight","2 Tim 2:15."]],"background":[["How we got the Bible (quick timeline)","c. 1450–1400 BC Moses writes the Law → c. 1000 BC David’s psalms → c. 430 BC Malachi (last OT book) → c. 250 BC the Septuagint (Greek OT) in Alexandria → AD 45–95 NT written → AD 367 Athanasius lists the 27 NT books → AD 405 Jerome’s Latin Vulgate → 1382 Wycliffe’s English Bible (hand-copied from Latin) → c. 1455 Gutenberg Bible → 1526 Tyndale’s NT from Greek → 1611 King James Version → 1982 New King James (used in this course)."],["Why manuscripts matter","Ancient books survive only as copies. Historians judge reliability by (1) how many copies exist and (2) how close they are to the original. The NT has about 5,800 Greek manuscripts plus ~10,000 Latin and thousands in other languages — far more than any other ancient work. The oldest NT fragment, P52 (John 18, kept in the John Rylands Library, Manchester), is usually dated to the first half of the 2nd century."],["The canon","The OT canon was recognised by the Jewish community before Christ (Jesus refers to “the Law, the Prophets and the Psalms,” Luke 24:44). NT books were accepted if they were apostolic (written by an apostle or close associate), used across the churches, and consistent with the faith. The church did not “create” the canon — it recognised books that already carried authority."]],"qa":[["Hasn’t the Bible been changed over time?","Compare manuscripts: the Dead Sea Scrolls let scholars compare Isaiah copies ~1,000 years apart — the differences are overwhelmingly spelling and small slips, with no change of doctrine. With thousands of NT copies, errors in one copy are caught by others."],["Why are there so many translations?","Language changes. Translations differ in style (word-for-word like NKJV/ESV vs. thought-for-thought like NLT), not in the message. Comparing two translations is a good study habit."],["Who decided which books are in the Bible?","See “The canon” in Background: the books were recognised, not invented, using tests of apostolic origin, consistency, and universal use."],["Does the Bible contradict science?","The Bible is not a science textbook, but where it touches nature it describes it accurately in everyday language. Many founders of modern science (Kepler, Newton, Pascal, Maxwell) were believers who saw science as “thinking God’s thoughts after Him.”"]],"quiz":[["What does “Bible” mean?",["The Word","Books","Holy","Law"],1,"From biblia — “books.” It is a library of 66 books."],["How many books are in the Old Testament?",["27","39","66","40"],1,"39 OT + 27 NT = 66."],["“Inspiration” in 2 Tim 3:16 literally means…",["Encouraging","God-breathed","Written by angels","Memorised"],1,"Theopneustos — God-breathed."],["Which discovery in 1947 confirmed the accuracy of the OT text?",["Tel Dan Stela","Dead Sea Scrolls","Rosetta Stone","Pool of Siloam"],1,"The Dead Sea Scrolls at Qumran."],["What are the three responses to the Word in this lesson?",["Pray, fast, give","Read, hear, keep","Learn, teach, preach","Love, serve, obey"],1,"Read (know), Hear (understand), Keep (apply) — Rev 1:3."],["Which verse says faith comes by hearing the Word?",["Hebrews 11:6","Romans 10:17","John 3:16","James 1:22"],1,"Romans 10:17."]],"bridge":"Next lesson begins at the very first verse: “In the beginning God…” — who God is, and how sin entered the world.","charts":[{"f":"charts/L1-1.jpg","t":"What is the Bible? / Who wrote the Bible?","sec":1,"no":"Chart L1.1"},{"f":"charts/L1-2.jpg","t":"Facts about the Bible: scientific & medical evidence","sec":3,"no":"Chart L1.2"},{"f":"charts/L1-3.jpg","t":"Facts about the Bible: historical evidence","sec":3,"no":"Chart L1.3"},{"f":"charts/L1-4.jpg","t":"Facts about the Bible: prophetic evidence","sec":3,"no":"Chart L1.4"},{"f":"charts/L1-5.jpg","t":"Keys of Lesson One","sec":-1,"no":"Chart L1.5"}]},{"n":2,"title":"God, Creation & the Fall","sub":"Who God is, how sin entered, and God’s first promise of a Savior","age":"Age of Innocence → Age of Conscience","cast":"God, angels, Adam, Eve, the serpent (devil)","bigIdea":"God created everything for relationship with Him; sin broke that relationship and brings death, but God in mercy promised a Savior.","objectives":["List characteristics of God from creation, judgment and redemption","Define sin and its consequences","Distinguish Man’s way of dealing with sin from God’s way"],"flow":[{"s":"A","t":"God — the grand subject of the Bible","pts":["God is the Beginning, Source and Author of all things (Gen 1:1).","God is Spirit (Gen 1:2; John 4:24) — called the Holy Spirit to distinguish Him from other spirits (Ps 51:11).","God is infinite — not bound by time, space or matter (Ps 90:2; Isa 40:25-26).","God is Creator; creation reveals His glory (Isa 44:24; Ps 19:1-4; Rom 1:20)."],"refs":["Genesis 1:1-2","John 4:24","Psalm 90:2","Isaiah 40:25-26","Isaiah 44:24","Psalm 19:1-4","Romans 1:20"],"explain":"Genesis 1:1 — the Hebrew word for God here is Elohim, and “created” is bara, a verb in the Bible used only with God as subject: making something from nothing. Isaiah 44:24 stresses God created “alone” and “by Myself” — no helper. Romans 1:20: creation leaves everyone “without excuse” because God’s power is visible in what He made.","ctx":"Genesis was written to Israel coming out of Egypt, where people worshipped the sun (Ra), the Nile (Hapi) and many animals. Genesis 1 quietly declares that the sun, moon, waters and animals are created things — not gods.","ex":"A painting implies a painter; a watch implies a watchmaker. The universe’s order implies a Designer.","ask":"What in nature makes you wonder about God the most?","key":1},{"s":"B","t":"What Creation teaches us about God","pts":["Day 1 light — God of order (1 Cor 14:33).","God of separation — light/dark, waters/sky, sea/land.","Day 4 sun, moon, stars for seasons.","Day 5–6 — God of blessing (“Be fruitful and multiply”).","“Good” 7 times; Man alone “very good” — God of perfection and excellence (Deut 32:3-4).","Day 7 — God blessed and made holy the rest day."],"refs":["Genesis 1:3-31","Genesis 2:2-3","1 Corinthians 14:33","Deuteronomy 32:3-4"],"explain":"Notice the pattern: Days 1–3 God forms (creates spaces: light, sky/sea, land); Days 4–6 God fills those spaces (lights, birds/fish, animals/man). Day 1 ↔ Day 4, Day 2 ↔ Day 5, Day 3 ↔ Day 6. “Good” (tov) means beautiful, functioning as designed. Only after Man is made is everything “very good.”","ctx":"Other ancient creation stories (e.g., Babylon’s Enuma Elish) describe gods fighting and creating humans as slaves to do the gods’ chores. Genesis says the opposite: one God creates peacefully by His word, and humans are crowned with His image and blessing.","ex":"Draw a 2×3 grid: Forming (Days 1–3) vs Filling (Days 4–6).","ask":"Which attribute of God from creation encourages you most today?"},{"s":"C","t":"Creation of Angels & the fall of Lucifer","pts":["Angels are created servants of God (Heb 1:14), innumerable (Heb 12:22).","Michael — the archangel (Jude 9); Gabriel — messenger (Luke 1:19).","Lucifer became proud: “I will be like the Most High” (Isa 14:14; Ezek 28:15).","His purpose: to defeat God’s plan for a love relationship with Man."],"refs":["Hebrews 1:14","Hebrews 12:22","Jude 9","Luke 1:19","Isaiah 14:12-15","Ezekiel 28:13-17","Revelation 12:4,9"],"explain":"Isaiah 14 is addressed to the king of Babylon and Ezekiel 28 to the king of Tyre, yet both go beyond any human king (“you were in Eden,” “anointed cherub”). Many teachers see the spiritual power behind those kings — Satan — described here. Notice the five “I will” statements of Isaiah 14:13-14: pride is the root of rebellion.","ctx":"“Lucifer” comes from the Latin Vulgate translation of Isaiah 14:12 (Hebrew helel, “shining one / morning star”). Revelation 12:4 (“a third of the stars”) is often linked to the angels who followed Satan.","ex":"Contrast Satan’s “I will” (Isa 14) with Jesus’ “not My will” (Luke 22:42).","ask":"Where do you see the “I will be like God” attitude in the world today?","key":2},{"s":"D","t":"Creation of Man","pts":["Made in God’s image (Gen 1:27), by Him and for Him (Rev 4:11; Col 1:16).","Given delegated dominion over the earth (Ps 8:3-6; Ps 115:16).","Given a helper — woman (Gen 2:21-23).","Given everything in Eden — and most of all, fellowship with God.","Given one command and a choice (Gen 2:15-17): God wants willing love, not robots."],"refs":["Genesis 1:27","Revelation 4:11","Colossians 1:16","Psalm 8:3-6","Genesis 2:15-17","Genesis 2:21-23","1 John 4:8"],"explain":"“Image” (tselem) in the ancient world was a statue a king placed in his territory to show who ruled there. Humans are God’s living “images,” representing His rule on earth. “Help meet” (ezer kenegdo) = a helper “corresponding to him” — ezer is used of God Himself helping Israel (Ps 121:1-2), so it means strength, not inferiority.","ctx":"Eden’s location is linked with the Tigris and Euphrates (Gen 2:14), in Mesopotamia. Adam’s name relates to adamah — ground: he is literally “earthling.”","ex":"A gift of love that is forced isn’t love. God placed the tree so that our “yes” to Him could be real.","ask":"Why do you think God gave Adam a choice instead of making disobedience impossible?","key":3},{"s":"E","t":"Innocence to the Fall","pts":["Satan’s strategy (Gen 3:1-5): plant doubt (“Has God indeed said?”), deny the Word (“You will not surely die”), attack God’s character, offer self-rule (“you will be like God”).","Eve reasoned with herself; Adam listened to his wife instead of God (Gen 3:6; Prov 14:12).","Sin defined: falling short of God’s glory (Rom 3:23), lawlessness (1 John 3:4), disobedience (Jas 2:10)."],"refs":["Genesis 3:1-6","Proverbs 14:12","Romans 3:23","1 John 3:4","James 2:10","1 John 2:16"],"explain":"Gen 3:6 lines up with 1 John 2:16: “good for food” = lust of the flesh; “pleasant to the eyes” = lust of the eyes; “desirable to make one wise” = pride of life. Jesus was tempted in the same three areas (Luke 4) and won each time by quoting Scripture — answering the serpent’s question “Has God said?” with “It is written.” Note Eve also added to God’s word (“nor touch it,” 3:3) — linking back to Lesson 1: don’t add or subtract.","ctx":"“Sin” (Hebrew chata; Greek hamartia) was an archery term: missing the mark. Judges 20:16 uses chata for slingers who “would not miss.”","ex":"Archery target: God’s glory is the bullseye. Any miss — by an inch or a mile — is still a miss (Rom 3:23).","ask":"What could Eve have done differently after the serpent spoke to her?"},{"s":"F","t":"Consequences of Sin","pts":["Breaks communion with God (Isa 59:2).","Introduces guilt, fear and shame (Prov 28:1). Guilt: “I made a mistake”; shame: “I am a mistake.”","Enslaves us (John 8:34).","Leads to death — spiritual and physical (Rom 6:23).","Affects the next generation (Ex 20:5) and our relationships (Adam blamed Eve)."],"refs":["Genesis 3:7-13","Isaiah 59:2","Proverbs 28:1","John 8:34","Romans 6:23","Exodus 20:5"],"explain":"God’s first question to fallen Man — “Where are you?” (3:9) — is not a request for location; God knew. It is an invitation to come out of hiding. Romans 6:23: “wages” (opsōnia) was the soldier’s ration-pay — sin always pays what it owes. But the verse continues: “the gift of God is eternal life.”","ctx":"Genesis 2:17 “in the day you eat… you shall surely die” — Adam lived 930 years, but spiritually he died that day (separation), and physical death began its work.","ex":"Sin is like a fish hook with bait: the bait is attractive; the hook is hidden.","ask":"Which consequence of sin do you see most clearly in the world around you?","key":4},{"s":"G","t":"Man’s way vs God’s way of dealing with sin","pts":["Man’s way: Blame (“the woman You gave me”), Hide, Cover up (fig leaves = self-righteousness; Isa 64:6).","God’s way: Take responsibility (Ps 51:3), Confess (Prov 28:13), Be covered by God’s mercy — animal skins (Gen 3:21).","Without shedding of blood there is no remission (Heb 9:22)."],"refs":["Genesis 3:7-8,21","Isaiah 64:6","1 John 1:8","Psalm 51:3","Proverbs 28:13","Hebrews 9:22"],"explain":"Fig leaves wilt; man-made coverings never last. God’s covering cost a life — the first death in the Bible was an innocent animal dying for guilty people. This introduces the substitution theme that runs through Abel’s lamb, Passover, the Tabernacle, and finally “the Lamb of God” (John 1:29).","ctx":"Isaiah 64:6 “filthy rags” — Hebrew beged iddim, literally menstrual cloths: in Israel’s purity law, the most unclean item imaginable. Even our best works can’t cleanse us.","ex":"Show a leaf and a leather belt: one is man’s covering, the other God’s. Which costs more?","ask":"What “fig leaves” do people use today to cover guilt?","key":5},{"s":"H","t":"Judgment & the Promise of a Savior","pts":["God is just: judgment on the serpent, the woman, the ground and the man (Gen 3:14-19).","God is merciful: Adam names his wife Eve — “life” — after hearing the judgment.","Genesis 3:15 — the first gospel: the Seed of the woman will crush the serpent’s head.","Animal blood is only temporary (Heb 10:4); Man is driven from Eden; cherubim guard the tree of life."],"refs":["Genesis 3:14-19","Genesis 3:15","Genesis 3:20-24","Hebrews 10:4","Deuteronomy 30:19-20"],"explain":"Genesis 3:15 is called the protoevangelium (“first gospel”). “Her Seed” — unusual, since seed is normally traced through the father; it hints at a virgin birth (Gal 4:4: “born of a woman”). The serpent bruises His heel (a painful but non-fatal wound — the cross), but He crushes the serpent’s head (a fatal blow — the resurrection’s victory). Cherubim with a flaming sword guard the way east; later, cherubim are woven into the Tabernacle veil (Lesson 6) — the way back to God is guarded until Christ opens it.","ctx":"The Tabernacle and Temple entrances faced east — the direction Adam was driven out. Returning to God’s presence meant moving west, back through the gate.","ex":"Hope in the middle of judgment: God announces the cure in the same breath as the curse.","ask":"How does Genesis 3:15 change how you see the story of the Fall?"}],"keys":["God is the grand [subject] of the Bible.","The purpose of Satan is to try and [defeat] God’s plan to have a beautiful [relationship] with Man.","God’s plan was to bring into existence a group of people who would [willingly] choose to [love] and serve Him.","Sin [separates] us from God and will eventually lead to [death].","Salvation from sin can only come from [God’s way]."],"words":[["Created","Hebrew bara","To create (only God is ever its subject)","Gen 1:1."],["Image","Hebrew tselem","Image, representative statue","Humans represent God’s rule."],["Help meet","Hebrew ezer kenegdo","A helper corresponding to him","Ezer is used of God helping Israel."],["Sin","Hebrew chata / Greek hamartia","To miss the mark","Archery term."],["Eve","Hebrew Chavvah","Life / living","Mother of all living (3:20)."],["Filthy rags","Hebrew beged iddim","Menstrual cloths","Isa 64:6."],["Enmity","Hebrew eybah","Deep hostility","Gen 3:15."]],"background":[["Eleven attributes of God in this lesson","Spirit · Infinite · Creator · Order · Separation · Blessing · Perfection & excellence · Holy · Love · Merciful · Just. A good review game: read an event and ask which attribute it shows."],["The Ages (dispensations) timeline","This course follows Ages: Innocence (Eden) → Conscience (Fall to Flood) → Human Government (after Flood) → Promise (Abraham) → Law (Moses) → Church Age (Pentecost) → Kingdom (Millennium). Lesson 2 covers the first and the start of the second."],["Genesis in its world","Genesis 1–3 answers the big questions every ancient people asked — where we came from, why the world is broken, and whether there is hope — but unlike other myths, the God of Genesis is one, good, personal and needs nothing from humans."]],"qa":[["Who is the “Us” in “Let Us make man” (Gen 1:26)?","Within this course’s framework (see Lesson 7) God is absolutely one (Deut 6:4; Isa 44:24 “by Myself”). Common explanations: a plural of majesty, God speaking to the angelic court, or God speaking with the future plan of redemption (the Son) in view. Verse 27 immediately switches back to singular: “in His own image.”"],["If God knew Adam would sin, why create him?","Because love requires freedom. God planned redemption before the world began (Rev 13:8; 1 Pet 1:20). The cross was not Plan B."],["Is the devil real?","Jesus spoke of him as real (John 8:44; Luke 10:18). But he is a created being — not God’s equal. God is omnipotent; Satan is limited."],["Why do innocent people suffer?","Suffering entered with sin and a cursed creation (Gen 3:17; Rom 8:20-22). God doesn’t always explain the why, but He entered our suffering in Christ and promises its end (Rev 21:4). See Lesson 2’s modular section on evil and suffering."],["How old is the earth?","Christians hold different views. Keep the focus on the lesson’s point: God created, sin entered, God promised a Savior. The modular section offers more if a student wants to go deeper."]],"quiz":[["What does “bara” (created) emphasise?",["God reshaped existing matter","Only God can do this kind of creating","Angels helped","It took millions of years"],1,"Bara always has God as its subject."],["Which day did God create the sun, moon and stars?",["Day 1","Day 3","Day 4","Day 6"],2,"Day 4 — light itself was created on Day 1."],["What was Satan’s first move with Eve?",["He lied","He questioned God’s Word","He offered fruit","He threatened her"],1,"“Has God indeed said…?” — doubt comes first."],["What does “sin” literally mean in Hebrew and Greek?",["Rebellion","Missing the mark","Darkness","Weakness"],1,"An archery term — missing the target."],["What did God use to cover Adam and Eve?",["Fig leaves","Linen","Tunics of skin","Wool"],2,"Gen 3:21 — an innocent animal died."],["Genesis 3:15 promises…",["The flood","The Seed of the woman will crush the serpent","Abraham’s calling","The Law"],1,"The first promise of a Savior."]],"bridge":"Outside Eden, sin spreads fast — from a family quarrel to a worldwide flood. Next: Cain and Abel, Enoch and Noah.","charts":[{"f":"charts/L2-1.jpg","t":"Biblical timeline: the Ages","sec":0,"no":"Chart L2.1"},{"f":"charts/L2-2.jpg","t":"Days of creation (Days 1–6)","sec":1,"no":"Chart L2.2"},{"f":"charts/L2-3.jpg","t":"Days of creation","sec":1,"no":"Chart L2.3"},{"f":"charts/L2-4.jpg","t":"Creation of Man & the corruption of man’s innocence","sec":3,"no":"Chart L2.4"},{"f":"charts/L2-5.jpg","t":"Sin and its consequences; the promised Seed","sec":5,"no":"Chart L2.5"},{"f":"charts/L2-6.jpg","t":"Keys of Lesson Two","sec":-1,"no":"Chart L2.6"}]},{"n":3,"title":"Cain, Abel & Noah","sub":"Grace, faith and obedience in a world heading for judgment","age":"Age of Conscience → Age of Human Government","cast":"God, Cain, Abel, Seth, Enoch, Noah","bigIdea":"God always extends mercy before judgment, and we receive His salvation by responding to His grace with faith and obedience — on His terms, not ours.","objectives":["Explain grace, faith and obedience","Find the parallel between Noah’s day and our day","Conclude from Cain, Abel and Noah that grace, faith and obedience are necessary for salvation"],"flow":[{"s":"A","t":"Cain and Abel — two offerings, two ways of worship","pts":["Genesis 3 = beginning of sin (against God); Genesis 4 = progress of sin (against a brother).","Cain (“acquired”) — a farmer; Abel (“breath/vapour”) — the first shepherd.","Abel’s offering: God-directed, by faith (Heb 11:4), firstborn and fat — his best.","Cain’s offering: man-created — “the way of Cain” (Jude 11; 1 John 3:12; Prov 14:12)."],"refs":["Genesis 4:1-5","Hebrews 11:4","Jude 11","1 John 3:12","Proverbs 14:12"],"explain":"Heb 11:4 says Abel offered “by faith” — and faith comes by hearing (Rom 10:17), suggesting God had revealed how to approach Him (likely through the animal-skin covering of Gen 3:21). Abel’s blood offering pointed to substitution; Cain brought the fruit of the ground God had just cursed (3:17), the product of his own labour. Note: God “respected Abel and his offering” — the person and the gift go together; heart and method both matter.","ctx":"Eve may have thought Cain was the promised Seed of Gen 3:15 (“I have acquired a man from the LORD”). Instead he became the first murderer — a reminder that the promise would not come through human effort. Abel’s name (hevel) is the same word as “vanity/vapour” in Ecclesiastes (“Vanity of vanities”) — his life was short, but Hebrews 11:4 says he “still speaks.”","ex":"Imagine two people writing a thank-you card: one follows the recipient’s request exactly, one does it his own way “because it’s nicer.” Which honours the recipient?","ask":"What are some “Cain-style” (man-made) ways people try to approach God today?","key":1},{"s":"B","t":"God’s mercy and Cain’s response","pts":["God came to Cain before judgment: “If you do well, will you not be accepted?” (Gen 4:6-7).","Sin “lies at the door” — crouching like an animal; “you should rule over it.”","Cain rejected mercy: murder, a lie, a sarcastic reply (“Am I my brother’s keeper?”).","Judgment: cursed ground, fugitive and vagabond, a protective mark, went out from God’s presence."],"refs":["Genesis 4:6-16","Hebrews 12:5-6"],"explain":"Gen 4:7 “lies at the door” uses a word (rabats) for a crouching animal — the same picture as a lion waiting to pounce. And “its desire is for you, but you should rule over it” echoes the wording of Gen 3:16, showing a battle for control. Even after murder God protects Cain with a mark — mercy again. But “Cain went out from the presence of the LORD” (4:16) — the saddest outcome is not punishment but distance from God.","ctx":"Cain’s line (Gen 4:17-24) builds cities, invents music and metalwork — culture flourishes — but ends with Lamech boasting of murder. Progress without God does not fix the heart.","ex":"A referee who warns before giving a red card: God’s warnings are mercy.","ask":"How did God extend mercy to Cain? How does He extend it to us before judgment?","key":2},{"s":"C","t":"Seth and Enoch","pts":["Seth (“appointed”) continues the line of the promised Seed (Gen 4:25).","Enoch, seventh from Adam, “walked with God… and he was not, for God took him” (Gen 5:24).","Enoch pleased God by faith (Heb 11:5) and prophesied judgment (Jude 14-16) — a picture of believers caught up (1 Thess 4:13-18)."],"refs":["Genesis 4:25-26","Genesis 5:21-24","Hebrews 11:5","Jude 14-16","1 Thessalonians 4:13-18"],"explain":"Genesis 5 repeats “and he died” like a drumbeat — the curse of Gen 2:17 in action. Enoch breaks the pattern. “Walked with God” suggests daily companionship, the very thing lost in Eden. Gen 4:26: in Seth’s day “men began to call on the name of the LORD” — public worship begins.","ctx":"Methuselah, Enoch’s son, lived 969 years. By the Genesis numbers, he died in the very year of the Flood — God’s patience stretched to its longest life.","ex":"Walking together means same direction, same pace, constant conversation.","ask":"What does “walking with God” look like on a normal weekday?"},{"s":"D","t":"Noah — judgment and a plan of salvation","pts":["Wickedness was great; every intent of the heart only evil (Gen 6:5-7).","Noah found grace (Gen 6:8) — the first time “grace” appears in the Bible.","God’s plan: an ark of gopherwood, 300×50×30 cubits, one door, three decks (Gen 6:13-16).","Noah did everything God commanded (Gen 6:22; Heb 11:7).","Only eight souls saved through water (1 Pet 3:20; 2 Pet 2:5)."],"refs":["Genesis 6:5-22","Genesis 7:21-23","Hebrews 11:7","1 Peter 3:20","2 Peter 2:5"],"explain":"Gen 6:6 “the LORD was sorry… grieved in His heart” — God’s judgment comes from a broken heart, not cold anger. “Grace” (chen) means favour; Noah didn’t earn it — he found it. The ark had one door (6:16), anticipating “I am the door” (John 10:9) and the single Tabernacle gate (Lesson 6). 1 Pet 3:20-21 directly links the Flood to baptism — a key bridge to Lesson 8.","ctx":"The ark: ~137 × 23 × 14 m (450 × 75 × 45 ft) using an 18-inch cubit — about 1.5 football fields long. Its 6:1 length-to-width ratio is close to modern cargo ships; a 1993 Korean ship-research institute (KRISO) study found such proportions very stable. Mesopotamian flood stories (Gilgamesh’s Utnapishtim, Atrahasis) share a hero, a boat, and birds sent out — but their gods send the flood because humans are too noisy, whereas Genesis grounds it in moral evil and grace.","ex":"Noah preached righteousness (2 Pet 2:5) for decades while building — imagine the mockery of building a ship far from the sea.","ask":"What details of God’s instructions do you think Noah was tempted to change?"},{"s":"E","t":"Grace, Faith and Obedience","pts":["Grace = God’s part: unearned favour; He initiates (Eph 2:8-9).","Faith = our response: believing and being persuaded (Heb 11:1; Greek pistis, from peithō).","Obedience = proof of faith (Jas 2:18; Heb 11:7 “by faith Noah… prepared an ark”).","Noah: Grace — God gave a plan; Faith — he believed; Obedience — he built."],"refs":["Ephesians 2:8-9","Hebrews 12:15","Hebrews 11:1","Hebrews 11:7","James 2:18"],"explain":"Eph 2:8-9 and James 2:18 are not in conflict: Paul says we are not saved by works that earn salvation; James says real faith always shows itself in action. Noah’s building didn’t earn the flood’s escape — but without building, his “faith” would have drowned. grace doesn’t remove choice; we contribute nothing to earn salvation, but we can receive or reject it.","ctx":"Hebrews 11 repeats “By faith… [someone] did…” — faith is always followed by a verb: offered, prepared, obeyed, went.","ex":"A free ticket to a concert (grace) is only useful if you believe it’s real (faith) and go to the venue and present it (obedience).","ask":"Can you identify grace, faith and obedience in another Bible story?","key":3},{"s":"F","t":"God establishes a covenant","pts":["Noah built an altar and offered clean animals.","God renewed Adam’s command: be fruitful and multiply (Gen 9:1).","Rainbow — the sign of God’s covenant never again to destroy all flesh by flood (Gen 9:12-17).","Covenant vs contract: covenants are personal, loyal, sacrificial and permanent."],"refs":["Genesis 8:20-22","Genesis 9:1","Genesis 9:12-17"],"explain":"The Hebrew for rainbow is qeshet — the ordinary word for a warrior’s bow. God hangs up His weapon in the sky, pointed away from the earth. Covenants in Scripture carry a sign: rainbow (Noah), circumcision (Abraham, Lesson 4), Sabbath (Moses), and in the New Testament the Spirit and baptism (Lessons 8–9).","ctx":"Ancient covenants (berit) were sealed with sacrifice — “cutting a covenant.” Noah’s altar (Gen 8:20) precedes God’s covenant.","ex":"Contract: “I’ll do my part if you do yours.” Covenant: marriage vows — “for better, for worse.”","ask":"Why do you think God binds Himself with covenants rather than contracts?","key":4},{"s":"G","t":"Noah’s day and our day","pts":["Then: great wickedness, violence, a preacher of righteousness, judgment by water.","Now: evil men and seducers, perilous times, gospel preached to all nations, judgment by fire (2 Pet 3:5-7).","Jesus: “As the days of Noah were, so also will the coming of the Son of Man be” (Matt 24:37-39).","God is longsuffering, not willing that any should perish (2 Pet 3:9)."],"refs":["2 Peter 3:3-10","Matthew 24:37-39","2 Timothy 3:1,13","Matthew 24:14"],"explain":"Matt 24:38 lists normal activities — eating, drinking, marrying. The danger of Noah’s day was not only extreme evil but busy indifference: “they did not know until the flood came.” 2 Pet 3:9 explains the delay: God’s patience is an opportunity to repent.","ctx":"Peter wrote to believers facing scoffers who said “nothing ever changes.” He answers: it changed once (the Flood) and it will again.","ex":"Weather warning analogy: when a typhoon signal is raised, the wise prepare even when the sky is still blue.","ask":"What does “preparing like Noah” look like for you this month?","key":5}],"keys":["We must approach God on His [terms] and not [ours].","Before God passes judgment, He will always extend [mercy].","We receive God’s gift of salvation by responding in [faith] and [obedience].","God saved Man to establish a [covenant] with them.","We need to [prepare] ourselves for coming [judgment]."],"words":[["Cain","Hebrew Qayin / qanah","Acquired, gotten","Gen 4:1."],["Abel","Hebrew Hevel","Breath, vapour","Same word as “vanity” in Ecclesiastes."],["Seth","Hebrew Shet","Appointed, granted","Gen 4:25 — “God has appointed another seed.”"],["Grace","Hebrew chen / Greek charis","Favour, unearned gift","First appears Gen 6:8."],["Faith","Greek pistis (from peithō)","Persuasion, trust","Heb 11:1."],["Rainbow","Hebrew qeshet","Bow (weapon)","God hangs up His war bow."],["Covenant","Hebrew berit","Binding agreement sealed by sacrifice","“Cutting” a covenant."]],"background":[["Global flood traditions","Hundreds of cultures preserve flood stories — Babylonian (Gilgamesh, Atrahasis), Sumerian (Ziusudra), Greek (Deucalion), Indian (Manu), Chinese, and many Native American and Pacific traditions. Common features: a warning, a boat, a family saved, birds or animals, a mountain landing."],["The ark’s seaworthiness","The lesson’s modular section cites a 1993 study by the Korea Research Institute of Ships and Engineering that compared 12 hull proportions; the Genesis proportions scored among the best for stability, strength and comfort."],["Life before the flood","Genesis 5 gives long lifespans (Adam 930, Methuselah 969). After the flood, lifespans drop (Abraham 175, Moses 120). The world after Noah is the start of the Age of Human Government — God institutes capital justice (Gen 9:6)."]],"qa":[["Where did Cain get his wife?","Adam and Eve had “sons and daughters” (Gen 5:4). Early on, Cain married a sister or niece; the later prohibition on close marriage came with the Law (Lev 18), when genetic risks had increased."],["Was the flood global or local?","The text uses universal language (“all the high hills under the whole heaven were covered,” Gen 7:19) and Jesus and Peter treat it as a world judgment. The lesson takes it as worldwide."],["Isn’t it unfair that God destroyed everyone?","God waited (1 Pet 3:20 “the Divine longsuffering waited”), warned through Noah’s preaching, and provided a way of escape that anyone could have entered."],["What was the mark of Cain?","The Bible doesn’t say. The point is that it protected him — mercy even in judgment."]],"quiz":[["Why was Abel’s offering accepted?",["It was bigger","He offered by faith in God’s way","Cain was older","It smelled better"],1,"Heb 11:4 — by faith, God’s prescribed way."],["What did God say was “at the door” of Cain?",["An angel","Sin","Abel","A blessing"],1,"Sin crouching like an animal (Gen 4:7)."],["Which man “walked with God” and did not see death?",["Seth","Enoch","Lamech","Noah"],1,"Gen 5:24; Heb 11:5."],["Grace is…",["Our part","God’s part — unearned favour","Obedience","A feeling"],1,"Grace is God initiating salvation."],["How many people were saved in the ark?",["Two","Seven","Eight","Twelve"],2,"1 Pet 3:20 — eight souls."],["The sign of God’s covenant with Noah was…",["Circumcision","The rainbow","The Sabbath","An altar"],1,"Gen 9:13."]],"bridge":"After the flood, people again try to rule without God at Babel — and God calls one man, Abraham, to begin a new nation.","charts":[{"f":"charts/L3-1.jpg","t":"The promised Seed: Abel, Seth, Enoch, Noah","sec":0,"no":"Chart L3.1"},{"f":"charts/L3-2.jpg","t":"The Flood and the covenant; days of Noah vs days of Christ","sec":3,"no":"Chart L3.2"},{"f":"charts/L3-3.jpg","t":"Keys of Lesson Three","sec":-1,"no":"Chart L3.3"}]},{"n":4,"title":"Abraham, Jacob & Joseph","sub":"God calls a man, keeps His promises, and teaches His people to depend on Him","age":"Age of Human Government → Age of Promise","cast":"God, Shem, Abraham, Sarah, Isaac, Jacob, Joseph","bigIdea":"God calls ordinary, flawed people to trust Him; He always keeps His promises, and He transforms those who surrender and lean on His strength.","objectives":["Relate their walk of faith to Abraham’s life","Infer from Jacob’s story that we must trust God’s strength, not our own","Trust and surrender to God in one area of life as Abraham, Jacob and Joseph did"],"flow":[{"s":"A","t":"Babel / Babylon","pts":["Noah’s sons: Shem, Ham, Japheth; Nimrod (Ham’s line) founded Babel (Gen 10:8-10).","They built a tower “to make a name for ourselves” and avoid being scattered — rebellion against “fill the earth” (Gen 9:1).","God confused their language and scattered them (Gen 11:7-9).","Babel becomes the Bible’s symbol of human rule without God — through to “Babylon” in Revelation."],"refs":["Genesis 11:1-9","Genesis 10:8-10","Genesis 9:1"],"explain":"Notice the contrast: at Babel people say “let us make a name for ourselves”; in the very next chapter God says to Abram “I will make your name great” (12:2). Human glory is grasped; God’s glory is given. Pentecost (Acts 2) reverses Babel: languages that divided now unite people in praise (connect to Lesson 9).","ctx":"Shinar = Sumer/Babylonia in southern Mesopotamia. With no stone there, builders used baked mud bricks and bitumen (asphalt) for mortar — exactly as Gen 11:3 says. The “tower” was likely a ziggurat, a stepped temple-mountain meant as a stairway for gods to come down. In Babylon, the great ziggurat Etemenanki means “house of the foundation of heaven and earth.” Babylonians said Bab-ili meant “gate of god”; Genesis puns on the Hebrew balal, “to confuse.”","ex":"A team project where everyone suddenly speaks a different language — the project stops instantly.","ask":"Where do you see “Babel” — people building to make a name for themselves without God — today?"},{"s":"B","t":"Abram’s calling","pts":["From Ur of the Chaldees; father Terah served other gods (Josh 24:2).","God’s call: leave country, family, father’s house → I will make you a great nation and bless all families of the earth (Gen 12:1-3).","Abram obeyed at 75, “not knowing where he was going” (Heb 11:8-10)."],"refs":["Genesis 11:31","Joshua 24:2","Genesis 12:1-5","Hebrews 11:8-10"],"explain":"Gen 12:1-3 contains seven “I will” promises — compare Satan’s five “I will”s in Isaiah 14 (Lesson 2). God’s blessing on Abraham was never only for him: “in you all the families of the earth shall be blessed” — fulfilled in Christ (Gal 3:8, 16).","ctx":"Ur was a wealthy Sumerian city on the Euphrates, excavated by Leonard Woolley in the 1920s–30s. Its patron god was the moon-god Nanna (Sin); Haran, where Terah settled, was also a moon-worship centre. God called Abram out of a sophisticated, idol-filled culture into tents.","ex":"GPS vs. a guide holding your hand: Abram didn’t get the map, he got the Guide.","ask":"What is God asking you to leave behind to follow Him?","key":1},{"s":"C","t":"Abram’s flaws, God’s promise & Abram’s impatience","pts":["Abram lied about Sarai in Egypt (Gen 12:11-13) — and again in Gen 20.","God promised descendants like the stars (Gen 15:5); Abram believed and it was counted as righteousness (15:6).","Sarai gave Hagar to Abram — Ishmael born when Abram was 86 (Gen 16)."],"refs":["Genesis 12:11-13","Genesis 15:5-6","Genesis 16:1-4,15-16"],"explain":"Genesis 15:6 is the verse Paul builds on in Romans 4 and Galatians 3: Abraham was justified by believing God before circumcision and before the Law. Yet the Hagar episode shows faith wobbling: trying to “help God” produced pain in the family that lasted generations.","ctx":"Ancient Near Eastern documents (e.g., Nuzi tablets and Hammurabi’s code) show a barren wife could legally give a slave-woman to her husband to bear an heir. Sarai’s plan was culturally normal — but it wasn’t God’s plan. In Gen 15:9-17 God alone passes between the cut animals: in ancient treaties both parties walked between the pieces, saying “may this happen to me if I break the covenant.” God took the oath on Himself.","ex":"Microwave vs slow cooker: God’s promises often take the slow-cooker route.","ask":"Where are you tempted to “make an Ishmael” instead of waiting for God?"},{"s":"D","t":"God’s covenant — Abram becomes Abraham","pts":["Name changed: Abram (“exalted father”) → Abraham (“father of a multitude”); Sarai → Sarah (“princess”).","Everlasting covenant: to be God to him and his descendants; the land of Canaan (Gen 17:7-8).","Sign: circumcision on the 8th day (Gen 17:10-14).","Today God has another sign of covenant for us (Lessons 8–9; Col 2:11-12)."],"refs":["Genesis 17:1-14","Colossians 2:11-12","Romans 4:11"],"explain":"Circumcision was a sign “in the flesh” — physical, permanent, marking belonging. Colossians 2:11-12 says believers receive “the circumcision made without hands… buried with Him in baptism.” This is the bridge this course builds to water baptism in Lesson 8.","ctx":"A name change in the ancient world marked a change of identity and ownership — kings renamed servants (Joseph → Zaphnath-Paaneah; Daniel → Belteshazzar). God renaming Abram claims him as His own.","ex":"A wedding ring is a sign of a covenant — the covenant is the commitment; the ring makes it visible.","ask":"Why do you think God attaches visible signs to invisible commitments?","key":2},{"s":"E","t":"Judgment on Sodom and Gomorrah","pts":["God reveals coming judgment to Abraham (Gen 18:20-21).","Abraham intercedes down to ten righteous (18:32).","Angels rescue Lot; the cities are destroyed; Lot’s wife looks back and becomes a pillar of salt (Gen 19).","A warning for our day (Luke 17:28-32; Jude 7)."],"refs":["Genesis 18:20-33","Genesis 19:1-26","Luke 17:28-32","Jude 7"],"explain":"Again: mercy before judgment — God reveals His plan, listens to intercession, and physically drags Lot’s family out (“the LORD being merciful to him,” 19:16). Jesus’ shortest sermon: “Remember Lot’s wife” (Luke 17:32) — she left Sodom physically but not in her heart.","ctx":"Sodom and Gomorrah were in the Jordan plain near the Dead Sea, an area rich in bitumen and sulphur deposits. Ezekiel 16:49-50 adds that Sodom’s sins included pride, excess, idleness and neglect of the poor, alongside the sexual sin highlighted in Genesis and Jude.","ex":"Abraham as intercessor: praying for people who don’t know they’re in danger.","ask":"Who is God putting on your heart to pray for, like Abraham prayed for Lot?"},{"s":"F","t":"Isaac’s birth and Abraham’s test","pts":["Isaac born when Abraham was 100 and Sarah 90 (Gen 21:5; Heb 11:11).","God tested Abraham: offer Isaac (Gen 22:1-2).","“We will come back to you” (22:5); “God will provide for Himself the lamb” (22:8).","A ram caught in the thicket; Jehovah-Jireh — “The LORD will provide” (22:13-14).","Abraham reasoned God could raise Isaac from the dead (Heb 11:17-19)."],"refs":["Genesis 21:1-7","Genesis 22:1-18","Hebrews 11:17-19"],"explain":"Gen 22:5 is the first time “worship” appears in the KJV — and it means surrender, not singing. Notice the Christ parallels: an only beloved son, a three-day journey, the son carrying the wood up the hill, a substitute provided, and the mountain of Moriah — where Solomon later built the Temple (2 Chr 3:1), near where Jesus was crucified. Abraham said God would provide “a lamb”; God provided a ram that day — the Lamb came later (John 1:29).","ctx":"Child sacrifice was practised by some Canaanite religions. God’s stopping Abraham shows decisively that the God of the Bible does not want human sacrifice — He provides the substitute Himself.","ex":"Isaac means “laughter” — Sarah laughed in disbelief (18:12), then in joy (21:6).","ask":"What is the “Isaac” — the precious thing — God may be asking you to trust Him with?","key":3},{"s":"G","t":"Jacob / Israel","pts":["Twins: Esau (red, hairy) and Jacob (heel-holder) — “the older shall serve the younger” (Gen 25:23).","Esau sold his birthright for stew — despising spiritual things (Heb 12:16).","Jacob the “supplanter” deceived his father, fled to Laban, was deceived in turn (Leah/Rachel).","Facing Esau’s 400 men, Jacob finally prayed (Gen 32:9-12), wrestled with God, and was renamed Israel — and walked with a limp."],"refs":["Genesis 25:21-34","Genesis 27:1-29","Genesis 28:10-22","Genesis 32:9-12,24-31","Hebrews 12:16"],"explain":"The birthright meant a double inheritance and family spiritual leadership. Jacob wanted the right thing but used the wrong methods. The deceiver gets deceived: Jacob tricked his father using his brother’s clothes; Laban tricked Jacob using his sister’s veil. At Peniel (“face of God”) Jacob’s “prevailing” came by clinging, not by winning — “I will not let You go unless You bless me.” The limp was a permanent reminder: lean on God.","ctx":"Bethel means “house of God” — where Jacob saw the ladder (Gen 28). Jesus later says He is that ladder (John 1:51). “Israel” is usually understood as “one who struggles with God” or “God prevails.”","ex":"A limp is a weakness that becomes a testimony: everyone who saw Jacob walk knew he had met God.","ask":"Where are you relying on your own cleverness instead of God’s strength?","key":5},{"s":"H","t":"Joseph — pit, Potiphar, prison, palace","pts":["Favoured son, coat of many colours, dreams of greatness → jealousy.","PIT: sold for 20 shekels of silver to Ishmaelite/Midianite traders (Gen 37:28).","POTIPHAR: rose to manage the house; resisted temptation; falsely accused.","PRISON: interpreted dreams; forgotten for two years.","PALACE: interpreted Pharaoh’s dreams; second ruler of Egypt (Gen 41:39-40).","Forgave his brothers: “You meant evil… God meant it for good” (Gen 50:20); faith that Israel would return (50:24-25; Heb 11:22)."],"refs":["Genesis 37:3-11,28","Genesis 39:1-23","Genesis 41:39-40","Genesis 45:4-8","Genesis 50:19-26","Hebrews 11:22"],"explain":"Gen 39 repeats “the LORD was with Joseph” in the pit-to-prison chapter, not just in the palace — God’s presence doesn’t mean absence of trouble. Gen 50:20 is a great verse on God’s sovereignty: He doesn’t cause the evil, but He outworks it. Had Joseph taken revenge, he would have destroyed the family line of the promised Seed (Judah’s line → David → Jesus).","ctx":"Joseph was sold at 17 (37:2) and stood before Pharaoh at 30 (41:46) — 13 years of waiting. Twenty shekels was the standard price of a young slave (compare Lev 27:5). Egyptian details in the story — shaving before seeing Pharaoh, gold chain of office, a signet ring, a chariot, embalming of Jacob — fit Egyptian court culture.","ex":"Use the 4 Ps on a whiteboard: Pit → Potiphar → Prison → Palace. Ask: at which P would you have given up?","ask":"Who might you need to forgive, trusting God to turn evil for good?","key":4}],"keys":["God is still calling individuals to [trust] and [follow] Him.","[Obedience] is Man’s part in accepting God’s covenant.","God always [fulfills] His promises.","God reveals Himself to us when we choose to [surrender] ourselves to Him.","God wants us to rely on His [strength] rather than our own."],"words":[["Babel","Hebrew balal (pun)","Confusion","Babylonians: bab-ili, “gate of god.”"],["Abraham","Hebrew","Father of a multitude","From Abram, “exalted father.”"],["Isaac","Hebrew Yitschaq","He laughs","Gen 21:6."],["Jacob","Hebrew Ya‘aqov","Heel-holder, supplanter","Gen 25:26."],["Israel","Hebrew Yisra’el","Struggles with God / God prevails","Gen 32:28."],["Jehovah-Jireh","Hebrew","The LORD will provide (lit. “will see”)","Gen 22:14."],["Bethel / Peniel","Hebrew","House of God / Face of God","Gen 28:19; 32:30."]],"background":[["The patriarchs’ world (c. 2000–1700 BC)","Semi-nomadic herders moved between city-states in Canaan, with famines often driving them to Egypt, whose Nile made it the region’s breadbasket. Wealth was counted in livestock, servants and wells."],["The 12 sons of Jacob","Leah: Reuben, Simeon, Levi, Judah, Issachar, Zebulun. Bilhah (Rachel’s maid): Dan, Naphtali. Zilpah (Leah’s maid): Gad, Asher. Rachel: Joseph, Benjamin. Judah becomes the royal tribe (David, Jesus); Levi becomes the priestly tribe (Lesson 6)."],["The Abrahamic covenant’s three promises","Land (Canaan), Seed (a great nation and ultimately the Messiah), Blessing (to all nations). These drive the storyline through the rest of the Bible."]],"qa":[["Why did God choose a liar like Abram or a cheat like Jacob?","Grace: God chooses flawed people and transforms them. It shows the story is about God’s faithfulness, not human heroes."],["Did God really want Abraham to kill Isaac?","No — God stopped him. It was a test of trust (Gen 22:1, 12) and a prophetic picture of God providing His own Lamb."],["Why does God allow favouritism and family pain in these stories?","The Bible reports honestly without approving. Isaac’s and Jacob’s favouritism caused deep wounds — lessons for our families."],["Is circumcision required today?","No (Acts 15; Gal 5:6). The New Covenant has a spiritual circumcision connected to baptism and the Spirit (Col 2:11-12) — Lessons 8 and 9."]],"quiz":[["What does Babel’s story show?",["God hates buildings","Human rule without God fails","Languages are evil","Cities are sinful"],1,"Babel = man making a name for himself apart from God."],["Abram was how old when he left Haran?",["65","75","86","100"],1,"Gen 12:4."],["What was the sign of God’s covenant with Abraham?",["Rainbow","Circumcision","Sabbath","Altar"],1,"Gen 17:10-11."],["What name did Abraham give the place where God provided the ram?",["Bethel","Peniel","Jehovah-Jireh","Moriah"],2,"“The LORD will provide.”"],["Jacob’s limp showed that…",["He lost the fight","He must now lean on God","He was punished","He was old"],1,"Key #5 — rely on God’s strength."],["Joseph’s 4 Ps in order:",["Palace, Pit, Prison, Potiphar","Pit, Potiphar, Prison, Palace","Pit, Prison, Potiphar, Palace","Potiphar, Pit, Palace, Prison"],1,"Pit → Potiphar → Prison → Palace."]],"bridge":"Israel’s family is safe in Egypt — but a new Pharaoh rises who “did not know Joseph.” Next: bondage, Moses and the Passover.","charts":[{"f":"charts/L4-1.jpg","t":"Age of Promise: Tower of Babel & Abraham","sec":0,"no":"Chart L4.1"},{"f":"charts/L4-2.jpg","t":"Birth of a nation: Abraham, Isaac, Jacob and the twelve tribes","sec":6,"no":"Chart L4.2"},{"f":"charts/L4-3.jpg","t":"Keys of Lesson Four","sec":-1,"no":"Chart L4.3"}]},{"n":5,"title":"Exodus: Moses & the Passover","sub":"God raises a deliverer and saves His people by the blood of a lamb","age":"Age of Promise → Age of Law","cast":"Pharaoh, Moses, Aaron, the Israelites","bigIdea":"Sin enslaves, but God provides a Deliverer and saves through the shed and applied blood of an innocent lamb — a picture of our salvation today.","objectives":["Identify Man’s need for a Deliverer from the bondage of sin","Recognise that shedding and applying innocent blood is necessary for salvation","Relate their own condition
