 to the story of the Exodus"],"flow":[{"s":"A","t":"Israel in bondage","pts":["A new king “who did not know Joseph” (Ex 1:8) — as foretold to Abram (Gen 15:13).","Hard labour building Pithom and Raamses; yet they multiplied (Ex 1:11-14).","Pharaoh ordered Hebrew baby boys killed (Ex 1:16, 22) — Satan attacking the promised Seed.","Like sin today: “whoever commits sin is a slave of sin” (John 8:34)."],"refs":["Exodus 1:8-22","Genesis 15:13","John 8:34","Exodus 2:23-25"],"explain":"Ex 2:23-25 has four verbs of God: He heard, remembered, looked, acknowledged (knew). Deliverance begins with Israel’s cry. Egypt began as comfort and ended as bondage — sin often works the same way.","ctx":"Exodus 12:40 gives 430 years in Egypt. Dating the Exodus: the “early date” (c. 1446 BC, based on 1 Kings 6:1) and the “late date” (c. 1260s BC, under Ramesses II, linked to the city name Raamses) are both held by Bible-believing scholars. Archaeologists have found mud bricks made with and without straw in Egyptian store cities — matching Ex 5:7-18.","ex":"A slave can’t free himself; he needs someone from outside with power to set him free.","ask":"Have you ever felt like the Israelites — wanting out but unable to free yourself?","key":1},{"s":"B","t":"Moses — God’s chosen deliverer","pts":["Hidden by his mother Jochebed; placed in an “ark” of bulrushes; adopted by Pharaoh’s daughter (Ex 2:1-10).","By faith he chose affliction with God’s people over the pleasures of sin (Heb 11:24-27).","Tried to deliver in his own strength — killed an Egyptian, fled to Midian for 40 years.","Called at the burning bush (Ex 3); gave four excuses; God: “I will be with your mouth.”","God revealed His name: I AM WHO I AM; YHWH (Ex 3:13-15)."],"refs":["Exodus 2:1-15","Hebrews 11:24-27","Exodus 3:1-15","Exodus 4:1-17","Acts 7:22-36"],"explain":"The word for Moses’ basket (tevah) is the same rare word used for Noah’s ark — both saved through water. Moses’ life falls into three 40-year periods (Acts 7:23, 30; Deut 34:7): 40 years thinking he was somebody (Egypt), 40 learning he was nobody (Midian), 40 seeing what God does with a nobody (wilderness). “I AM” (ehyeh) shows God is self-existent and eternal; YHWH is formed from that verb. Jesus later says “Before Abraham was, I AM” (John 8:58) — Lesson 7.","ctx":"“Moses” is an Egyptian name element meaning “born of / son” (as in Thutmose, Ramesses), with a Hebrew wordplay on mashah, “to draw out” (Ex 2:10). Jews out of reverence avoided saying YHWH and read “Adonai” (Lord); English Bibles print LORD in capitals. “Jehovah” comes from combining YHWH’s consonants with Adonai’s vowels.","ex":"Moses’ staff — a shepherd’s ordinary stick — became “the rod of God” (Ex 4:20). What’s in your hand?","ask":"Which of Moses’ four excuses do you relate to most?","key":2},{"s":"C","t":"Judgment on Egypt — the ten plagues","pts":["Pharaoh: “Who is the LORD that I should obey Him?” (Ex 5:2).","Blood · Frogs · Lice · Flies · Livestock disease · Boils · Hail · Locusts · Darkness · Death of the firstborn.","Each plague exposed Egypt’s gods (Ex 12:12).","Mercy before judgment: repeated warnings over many months."],"refs":["Exodus 5:1-2","Exodus 7–11","Exodus 11:4-6","Exodus 12:12"],"explain":"Exodus says both that Pharaoh hardened his own heart (8:15, 32) and that God hardened it (9:12 onward). Pharaoh chose first; God then confirmed the choice (see the lesson’s modular section). From the fourth plague God distinguishes Goshen, where Israel lived — “that you may know I am the LORD in the midst of the land” (8:22).","ctx":"Commonly suggested links between plagues and Egyptian deities: Nile to blood — Hapi (Nile god); frogs — Heqet (frog-headed fertility goddess); livestock — Apis bull and Hathor (cow goddess); hail — Nut (sky goddess); locusts — crops under Osiris; darkness — Ra (sun god, chief of the gods); firstborn — Pharaoh himself, considered a god-king whose son was heir to divinity.","ex":"Make a two-column chart: Plague | Egyptian god defeated.","ask":"Why do you think God judged Egypt’s gods and not just Pharaoh?"},{"s":"D","t":"Passover — Israel’s plan of salvation in Egypt","pts":["A lamb per household, without blemish, male of the first year; chosen on the 10th, killed on the 14th (Ex 12:3-6).","Blood applied with hyssop on the doorposts and lintel (Ex 12:7, 22).","“When I see the blood, I will pass over you” (Ex 12:13).","Israel obeyed exactly (Ex 12:28); at midnight the firstborn of Egypt died; Pharaoh released Israel."],"refs":["Exodus 12:3-13","Exodus 12:21-31","Hebrews 9:22","1 Corinthians 5:7","1 Peter 1:18-19"],"explain":"Two things saved: the blood shed (lamb killed) AND the blood applied (on the door). A lamb killed but blood left in the basin would not have protected the house — Key #3. “Christ, our Passover, was sacrificed for us” (1 Cor 5:7). Hyssop reappears at the cross (John 19:29) and in David’s prayer “purge me with hyssop” (Ps 51:7).","ctx":"Jesus entered Jerusalem around the 10th of Nisan (the lamb-selection day) and died at Passover; John notes not a bone of His was broken (John 19:36; Ex 12:46). The Jewish year was reset around this event (Ex 12:2) — salvation becomes a new beginning. Jewish families still celebrate the Passover Seder today.","ex":"Draw the doorframe: blood on the top and two sides — the motion traces a cross.","ask":"What’s the difference between knowing Jesus died and having His blood applied to your life?","key":3},{"s":"E","t":"The Exodus — through the sea","pts":["God led them the long way to avoid war (Ex 13:17-18).","Pillar of cloud by day, fire by night (Ex 13:21-22).","Pharaoh pursued; the sea parted; Israel crossed on dry ground; Egypt’s army drowned (Ex 14).","“All were baptized into Moses in the cloud and in the sea” — examples for us (1 Cor 10:1-6)."],"refs":["Exodus 13:17-22","Exodus 14:19-28","1 Corinthians 10:1-6"],"explain":"Paul (1 Cor 10) reads the Exodus as a pattern: Egypt (sin) → blood (Passover) → sea (water baptism) → cloud (the Spirit) → manna and water (spiritual food) → journey. This course’s note: the cloud and the sea are a type and shadow of NT salvation — baptized in water and filled with God’s presence (Lessons 8–9). The sea was both salvation (for Israel) and judgment (for Egypt) — the same water.","ctx":"The Hebrew is Yam Suph, often translated “Sea of Reeds.” The exact crossing point is debated (Gulf of Suez, the Bitter Lakes, or the Gulf of Aqaba), but the text’s emphasis is a miraculous wall of water on both sides (14:22).","ex":"Burning your bridges: once through the sea, Egypt’s power over them was literally drowned.","ask":"What “Egyptian army” from your past do you need to leave on the other side of the water?","key":4},{"s":"F","t":"Birth of the nation of Israel","pts":["At Mount Sinai God gives the Law — moral, ceremonial and civil — and the Tabernacle plan.","After 430 years in Egypt, they had no national structure; God forms them into a nation.","“A special treasure… a kingdom of priests and a holy nation” (Ex 19:5-6)."],"refs":["Exodus 19:1-6","1 Peter 2:9"],"explain":"Ex 19:1 dates Israel’s arrival at Sinai in the third month — Jewish tradition connects the giving of the Law with the Feast of Weeks (Shavuot/Pentecost), 50 days after Passover. Powerful preview for Lesson 9: at Sinai the Law was written on stone and about 3,000 died (Ex 32:28); at Pentecost the Spirit was written on hearts and about 3,000 were saved (Acts 2:41). “The letter kills, but the Spirit gives life” (2 Cor 3:6).","ctx":"Mount Sinai’s traditional location is Jebel Musa in the southern Sinai Peninsula (site of St Catherine’s Monastery); some scholars suggest locations in Arabia.","ex":"From slaves with no identity to “a special treasure” — God gives identity before He gives rules.","ask":"How does knowing you are God’s “special treasure” change how you see His commands?","key":5}],"keys":["Sin puts us in [bondage] and [death].","God’s plan of salvation involves a [Deliverer].","God’s plan of salvation requires the [shedding] and [application] of innocent blood.","The Exodus of Israel is an [example] of our salvation today.","God wants to save a group of people to be [set apart] for Him."],"words":[["Exodus","Greek exodos","Exit, going out","Title of the book."],["Moses","Egyptian / Hebrew","Son / drawn out","Ex 2:10."],["I AM","Hebrew ehyeh asher ehyeh","I AM WHO I AM / I will be what I will be","Ex 3:14."],["YHWH","Hebrew","The covenant name of God (LORD)","Read as Adonai by Jews."],["Passover","Hebrew Pesach","To pass over, spare, protect","Ex 12:13."],["Red Sea","Hebrew Yam Suph","Sea of Reeds","Ex 13:18."]],"background":[["Four excuses of Moses","1) Who am I? (3:11) — God: “I will be with you.” 2) What if they don’t believe? (4:1) — God: signs. 3) I’m not eloquent (4:10) — God: “Who made man’s mouth?” 4) Send someone else (4:13) — God angry, sends Aaron. God answers ability questions with His presence."],["Passover → Lord’s Supper","At the Last Supper (a Passover meal) Jesus took the bread and the cup and gave them new meaning: “This is My body… This is My blood of the new covenant” (Matt 26:26-28)."],["Types and shadows","A “type” is a real historical person or event that also prefigures something greater. The lamb, the blood, the sea and the cloud are types fulfilled in Christ and the new birth (Col 2:17; Heb 10:1)."]],"qa":[["Why did God harden Pharaoh’s heart — was that fair?","Pharaoh first hardened his own heart repeatedly; God then confirmed his chosen direction (Rom 1:24-28 shows the same principle). God gave many chances."],["Why did the firstborn of Egypt have to die?","Pharaoh had killed Israel’s baby boys (Ex 1:22) and God had warned, “Israel is My son, My firstborn… if you refuse… I will kill your firstborn” (Ex 4:22-23). It was justice after long patience — and anyone who applied the blood was spared."],["Is there evidence of the Exodus?","Direct archaeological evidence for a desert journey is hard to find (nomads leave few traces). Indirect evidence includes Semitic slaves in Egypt, store cities, brick-making with straw, and the Merneptah Stele (c. 1208 BC) naming “Israel” as a people in Canaan."]],"quiz":[["What did Pharaoh command about Hebrew baby boys?",["Enslave them","Throw them in the river","Teach them Egyptian","Send them away"],1,"Ex 1:22."],["How many excuses did Moses give God?",["Two","Three","Four","Seven"],2,"Four excuses (Ex 3–4)."],["God’s name revealed to Moses was…",["El Shaddai","I AM WHO I AM","Jehovah-Jireh","Immanuel"],1,"Ex 3:14."],["For the Passover to work, the blood had to be…",["Shed only","Shed and applied","Drunk","Burnt"],1,"Key #3 — shed and applied."],["1 Corinthians 10 says Israel was “baptized into Moses” in…",["The Jordan","The cloud and the sea","The Nile","The Tabernacle"],1,"1 Cor 10:2."],["At Sinai God called Israel…",["A great army","A kingdom of priests and a holy nation","A wealthy people","A new Egypt"],1,"Ex 19:6."]],"bridge":"Israel is free — but how can a sinful people live with a holy God? Next: the Law and the Tabernacle.","charts":[{"f":"charts/L5-1.jpg","t":"The life of Moses","sec":1,"no":"Chart L5.1"},{"f":"charts/L5-2.jpg","t":"The Exodus: plagues of judgment","sec":2,"no":"Chart L5.2"},{"f":"charts/L5-3.jpg","t":"The Passover: saving of the firstborn","sec":3,"no":"Chart L5.3"},{"f":"charts/L5-4.jpg","t":"The wilderness journey","sec":4,"no":"Chart L5.4"},{"f":"charts/L5-5.jpg","t":"Keys of Lesson Five","sec":-1,"no":"Chart L5.5"}]},{"n":6,"title":"A Holy God, a Holy People: The Law & the Tabernacle","sub":"How a holy God made a way to dwell with His people","age":"Age of Law","cast":"God, Moses, Aaron and the priests, Israel","bigIdea":"God is holy and wants to dwell with His people; the Law reveals our sin, and the Tabernacle is a blueprint of how sinful people approach a holy God — fulfilled in Jesus.","objectives":["List the ways God introduced His holiness to Israel","List the articles of the Tabernacle and their purposes","State how the Tabernacle points to Jesus Christ"],"flow":[{"s":"A","t":"Israel, the beginning of a holy nation","pts":["“A kingdom of priests and a holy nation” (Ex 19:5-6).","Canaan’s religions were idolatrous and immoral; Israel must be different (Lev 18:3).","God’s desire for the church is the same (1 Pet 2:9)."],"refs":["Exodus 19:5-6","Leviticus 18:3","1 Peter 2:9"],"explain":"Peter takes the titles God gave Israel at Sinai and applies them to the church — the purpose (to be set apart and to show His praises) carries over.","ctx":"Canaanite worship centred on Baal (storm/fertility god) and Asherah, with fertility rites and, at times, child sacrifice — texts from Ugarit (modern Syria, discovered 1928) describe these religions.","ex":"A wedding dress is “set apart” — you don’t wear it to clean the garage.","ask":"In what ways should God’s people look different from the culture around them?"},{"s":"B","t":"God’s desire for a holy people","pts":["“Be holy, for I am holy” (Lev 11:44; 1 Pet 1:16).","God’s love is a holy love: “God is light” and “God is love” (1 John 1:5; 4:8).","God wants to dwell among them (Ex 29:46).","Holy (qadosh) = set apart, marked off, different — belonging to God.","Five ways God made Israel different: holy presence & power, holy law, holy place, holy priesthood, holy land."],"refs":["Leviticus 11:44","1 John 1:5","Exodus 29:46","Deuteronomy 23:14","Isaiah 6:1-5"],"explain":"Isaiah 6:3 — seraphim cry “Holy, holy, holy” — the only attribute of God repeated three times in a row in Scripture (Hebrew repetition = superlative). Isaiah’s response (“Woe is me”) shows that seeing God’s holiness exposes our sin.","ctx":"Leviticus’ holiness code covers food, clothing, skin disease, mildew, childbirth, sexuality — teaching Israel that every part of life belongs to God.","ex":"Bride and bridegroom: holiness is first belonging, then behaviour flowing from belonging.","ask":"How would you explain “holiness” to a friend without using religious words?","key":1},{"s":"C","t":"God’s holy presence and power","pts":["The Shema: “Hear, O Israel: The LORD our God, the LORD is one!” (Deut 6:4).","“Besides Me there is no God” (Isa 44:6).","God judged Egypt’s gods (Ex 12:12) and showed His presence at Sinai with thunder, lightning, trumpet and smoke (Ex 20:18)."],"refs":["Deuteronomy 6:4-6","Isaiah 44:6","Exodus 12:12","Exodus 20:18-21"],"explain":"Shema means “Hear!” — Jews still recite it morning and evening. In a world of many gods, Israel’s defining belief was that God is one. (This truth is developed in Lesson 7.)","ctx":"Israel came out of Egypt, a land of hundreds of gods, and into Canaan, a land of local Baals. Monotheism set them apart from every neighbour.","ex":"A mountain trembling with fire: God’s presence is not casual.","ask":"Why do you think God first revealed Himself as one God before anything else?","key":2},{"s":"D","t":"God’s holy Law","pts":["Chosen not for size but because of His love and oath (Deut 7:6-8).","Laws covered moral, civil and ceremonial life — like a constitution.","The Ten Commandments (Ex 20:1-17).","The Law reveals sin and was a tutor to bring us to Christ (Gal 3:19, 24)."],"refs":["Deuteronomy 7:6-8","Exodus 20:1-17","Galatians 3:19,24","Romans 3:20"],"explain":"Ten Commandments in plain words: 1 Only God gets first place. 2 Don’t shrink God into an image you can control. 3 Don’t use God’s name emptily (lit. “lift it up for nothing” — including false oaths). 4 Keep a holy rhythm of rest and worship. 5 Honour parents — the first commandment with a promise (Eph 6:2). 6 Don’t murder — Jesus extends it to hatred (Matt 5:21-22). 7 Don’t commit adultery — Jesus extends it to lust (Matt 5:27-28). 8 Don’t steal — includes time, wages, credit. 9 Don’t lie about others. 10 Don’t covet — the only one about the heart’s desire, which Paul says exposed his sin (Rom 7:7). Commands 1–4: love God; 5–10: love neighbour (Matt 22:37-40). Galatians 3:24 “tutor” (paidagōgos) was the household slave who walked a child to school — the Law walks us to Christ.","ctx":"Ancient treaties between a great king and a vassal (e.g., Hittite treaties) began by stating what the king had done, then gave stipulations. The Ten Commandments begin the same way: “I am the LORD your God, who brought you out of Egypt” (20:2) — grace before law.","ex":"The Law is a mirror: it shows the dirt on your face but can’t wash it off.","ask":"Which commandment is most ignored in our culture today?","key":3},{"s":"E","t":"God’s holy place — the Tabernacle","pts":["Mishkan = “dwelling place”: God wants to dwell with His people.","Built exactly to the pattern shown on the mountain (Ex 25:9; Heb 8:5).","Portable, carried by the Levites; served by a holy priesthood — now every believer is a priest (1 Pet 2:5, 9).","Israel camped around it, facing it (Num 2:2).","The cloud above it led their journeys (Ex 40:36-38; Num 9:21-23) — led by the Spirit (Rom 8:14)."],"refs":["Exodus 25:8-9","Hebrews 8:5","Numbers 1:50-51","Numbers 2:2","Exodus 40:34-38","Numbers 9:21-23","Romans 8:14"],"explain":"Mishkan comes from shakan, “to dwell” — the root of the later word Shekinah (God’s dwelling glory). John 1:14 says “the Word became flesh and dwelt among us” — Greek eskēnōsen, literally “tabernacled” among us. Jesus is the true Tabernacle.","ctx":"The camp layout (Num 2): Levites closest around the Tabernacle; then three tribes on each side — Judah’s camp on the east (at the entrance), Reuben south, Ephraim west, Dan north. The gate faced east (compare Eden’s east-facing entrance, Lesson 2). The court measured 100 × 50 cubits (~46 × 23 m).","ex":"Pitch your tent facing God: what we face shapes our life.","ask":"Why do you think God wanted the Tabernacle at the centre with every tent facing it?"},{"s":"F","t":"Furnishings of the Tabernacle","pts":["Built God’s way (Ex 26:30) — like Noah’s ark.","Gate — only one way in (John 10:9).","Brazen Altar — sacrifice for sin; blood atones (Lev 17:11; John 1:29).","Brazen Laver — washing; priests washed or died (Ex 30:17-21).","Holy Place: Golden Lampstand (light of the world, John 8:12); Table of Shewbread (bread of life, John 6:35); Altar of Incense (prayers, Rev 5:8).","Veil — Christ’s flesh (Heb 10:19-20), torn at His death (Mark 15:38).","Ark of the Covenant: manna, Aaron’s rod, tablets; Mercy Seat sprinkled with blood (Lev 16:15)."],"refs":["Hebrews 9:1-9","Exodus 27:1-2","Exodus 30:17-21","Exodus 25:23-40","Exodus 30:1-10","Exodus 26:31-33","Exodus 25:10-22","Hebrews 10:19-20","Mark 15:37-38"],"explain":"Walk the student through the path as if they were a worshipper: enter the one gate → stop at the altar (sacrifice) → wash at the laver (cleansing) → into the Holy Place (light, bread, prayer) → beyond the veil to the mercy seat (God’s presence). The laver connects to washing (Titus 3:5; Acts 22:16) — this course links it to baptism in Lesson 8. The mercy seat (kapporet, “covering”) is translated in the Greek OT as hilastērion — the same word Paul uses for Jesus in Romans 3:25 (“propitiation”): Jesus is our mercy seat. The ark’s items were reminders of Israel’s failures (complaining, rebellion, idolatry) — covered by blood on the mercy seat.","ctx":"Materials: acacia wood (a hardy desert tree) overlaid with bronze outside and gold inside — the closer to God, the more precious the metal. The lampstand (menorah) was hammered from one talent of gold (~34 kg) with seven lamps fuelled by pure olive oil. The Most Holy Place was a perfect cube, 10 × 10 × 10 cubits — the New Jerusalem is also a cube (Rev 21:16, Lesson 12). Jewish tradition (Mishnah) describes the later Temple veil as a handbreadth thick. By Solomon’s time only the tablets remained in the ark (1 Kings 8:9).","ex":"Build it physically: use a table layout or paper cut-outs to place each piece in order.","ask":"What would happen if a priest skipped the laver?","key":4},{"s":"G","t":"God’s holy land","pts":["God dwells among Israel, so the land must not be defiled (Num 35:34).","The land “flowing with milk and honey” (Ex 3:17).","We are pilgrims seeking a heavenly country (Heb 11:13, 16)."],"refs":["Numbers 35:34","Exodus 3:17","Hebrews 11:13-16"],"explain":"The promised land points beyond itself: Abraham “waited for the city whose builder and maker is God” (Heb 11:10) — the New Jerusalem (Lesson 12).","ctx":"“Milk and honey” — milk from goats grazing on hills, honey likely including date syrup — a picture of rich pasture and fruitfulness compared with Egypt’s irrigated fields.","ex":"Passport holders: we live here but our citizenship is in heaven (Phil 3:20).","ask":"How does being a “pilgrim” change how you hold onto possessions?"},{"s":"H","t":"The Tabernacle and a holy Saviour","pts":["Day of Atonement: the high priest entered with blood once a year (Lev 16; Heb 9:7).","Christ entered once for all with His own blood (Heb 9:11-12).","Path of faith (Man → God): Gate → Altar → Laver → Holy Place → Most Holy.","Path of grace (God → Man): God came out of the Holy of Holies, robed Himself in flesh, and opened the way."],"refs":["Leviticus 16","Hebrews 9:11-12","Hebrews 10:19-22"],"explain":"Hebrews 10:19-22 is the New Testament application of the whole Tabernacle: boldness to enter (veil torn), a High Priest (Jesus), hearts sprinkled (blood) and bodies washed with pure water (laver). Grace comes first, from the inside out; faith responds from the outside in.","ctx":"Yom Kippur (Day of Atonement) is still the holiest day of the Jewish calendar. Two goats were used: one sacrificed, one (the scapegoat) sent into the wilderness carrying the people’s sins (Lev 16:21-22).","ex":"Draw two arrows on the Tabernacle diagram: grace coming out, faith going in.","ask":"Which piece of the Tabernacle speaks to you most right now?","key":5}],"keys":["We need to be [holy] to be in a relationship with a holy God.","God reveals His holiness to Israel by revealing Himself to be the [one] and only God.","The law reveals [sin] and points us to our need for a [Saviour].","The Tabernacle contains the [blueprint] of how we can approach a holy God.","God came in [flesh] so that we can approach Him in [faith]."],"words":[["Holy","Hebrew qadosh","Set apart, different, belonging to God","Lev 11:44."],["Tabernacle","Hebrew mishkan","Dwelling place","From shakan, to dwell."],["Dwelt","Greek eskēnōsen","Pitched a tent / tabernacled","John 1:14."],["Mercy seat","Hebrew kapporet / Greek hilastērion","Covering / place of atonement","Rom 3:25 “propitiation.”"],["Shema","Hebrew","Hear!","Deut 6:4."],["Tutor","Greek paidagōgos","Child-guardian who escorted to school","Gal 3:24."]],"background":[["Tabernacle at a glance","Outer court: Gate, Brazen Altar, Laver. Holy Place: Lampstand (south), Table of Shewbread (north), Altar of Incense (before the veil). Most Holy Place: Ark of the Covenant with the Mercy Seat and two cherubim."],["Why so much detail?","About 50 chapters across Exodus, Leviticus, Numbers, Deuteronomy and Hebrews deal with the Tabernacle and its service — more space than the creation account. God cares how we approach Him."],["Priests","Only Aaron’s descendants (tribe of Levi) served as priests; only the high priest entered the Most Holy Place, once a year. In Christ, all believers are a “royal priesthood” (1 Pet 2:9) with direct access (Heb 4:16)."]],"qa":[["Do Christians have to keep the Old Testament Law?","The moral heart of the Law (love God, love neighbour) is affirmed in the NT; the ceremonial system (sacrifices, Tabernacle rituals) is fulfilled in Christ (Heb 8–10). The Law shows our need; Christ meets it."],["Where is the Ark of the Covenant today?","No one knows. It disappears from the record around the Babylonian destruction (586 BC). Revelation 11:19 pictures the true ark in heaven."],["Is God’s holiness more important than His love?","This course stresses that God’s love is a holy love — they are not in competition. Love without holiness becomes permissive; holiness without love becomes harsh. God is both (1 John 1:5; 4:8)."]],"quiz":[["The Hebrew word for “holy” means…",["Perfect","Set apart, different","Ancient","Powerful"],1,"Qadosh — set apart."],["How many entrances did the Tabernacle court have?",["One","Two","Four","Twelve"],0,"One gate — one way (John 10:9)."],["Which furnishing pictures Jesus as the bread of life?",["Lampstand","Table of Shewbread","Laver","Altar of Incense"],1,"John 6:35."],["What did the incense represent?",["Money","Prayers of the saints","The Law","Angels"],1,"Rev 5:8."],["What happened to the Temple veil when Jesus died?",["It caught fire","It was torn from top to bottom","It was rolled up","Nothing"],1,"Mark 15:38."],["The Law is like a…",["Soap","Mirror / tutor bringing us to Christ","Ladder to heaven","Crown"],1,"Gal 3:24."]],"bridge":"The Tabernacle pointed to a Person. Centuries later, God Himself “tabernacled” among us — Jesus Christ.","charts":[{"f":"charts/L6-1.jpg","t":"The Law of Israel","sec":3,"no":"Chart L6.1"},{"f":"charts/L6-2.jpg","t":"The Tabernacle","sec":4,"no":"Chart L6.2"},{"f":"charts/L6-3.jpg","t":"Furniture of the Tabernacle: overview","sec":5,"no":"Chart L6.3"},{"f":"charts/L6-4.jpg","t":"Furniture of the Tabernacle: A. The outer court","sec":5,"no":"Chart L6.4"},{"f":"charts/L6-5.jpg","t":"Furniture of the Tabernacle: B. The Holy Place","sec":5,"no":"Chart L6.5"},{"f":"charts/L6-6.jpg","t":"Furniture of the Tabernacle: C. The Most Holy Place","sec":5,"no":"Chart L6.6"},{"f":"charts/L6-7.jpg","t":"Keys of Lesson Six","sec":-1,"no":"Chart L6.7"}]},{"n":7,"title":"Jesus Christ: God with Us","sub":"Who Jesus is, why He came, and the gospel of His death, burial and resurrection","age":"Age of Law → Church Age","cast":"Jesus, Mary, John the Baptist, the Jews","bigIdea":"Jesus is the one God of the Old Testament revealed in flesh, who came to destroy the work of Satan and save us from sin through His death, burial and resurrection.","objectives":["Describe why Jesus came","Compare Jesus with the God of the Old Testament and conclude they are One"],"flow":[{"s":"Bridge","t":"From Joshua to Jesus (Lesson summary)","pts":["Joshua leads Israel into the Promised Land; after him Israel falls into idolatry.","Judges, then kings: Saul, David, Solomon; the kingdom divides — Israel (north) and Judah (south).","Good kings → prosperity; bad kings → idolatry and captivity.","Prophets foretell a Messiah who will deliver and establish God’s kingdom.","The NT opens with Israel under Roman rule."],"refs":["Joshua 24:15","2 Samuel 7:12-16","Isaiah 9:6-7","Micah 5:2"],"explain":"2 Samuel 7 is the Davidic covenant: a son of David will have an everlasting throne — why the angel tells Mary Jesus will receive “the throne of His father David” (Luke 1:32).","ctx":"The ~400 “silent years” between Malachi and Matthew: Persia rules → Alexander the Great (333 BC) spreads Greek language and culture → the Maccabean revolt (167–164 BC, origin of Hanukkah) → Hasmonean Jewish kings → Rome takes Jerusalem (63 BC) → Herod the Great rules as Rome’s client king (37–4 BC). Galatians 4:4 calls this “the fullness of the time”: a common language (Koine Greek), Roman roads and peace for the gospel to travel, synagogues across the empire, and intense Messianic expectation.","ex":"Show the timeline on the Ages chart — we move from the Age of Law toward the Church Age.","ask":"Why do you think God waited until this particular moment in history?"},{"s":"A","t":"Introduction to the New Testament","pts":["Gospels (Matthew–John): introduce Christ.","Acts: how to get into Christ — the birth of the Church.","Epistles (Romans–Jude): how to stay in Christ.","Revelation: how it ends for those in Christ and those not.","The New Testament took effect at Jesus’ death (Heb 9:16-17)."],"refs":["Hebrews 9:16-17"],"explain":"Hebrews 9:16-17 uses the double meaning of diathēkē — covenant and last will/testament. A will takes effect only when the testator dies. So during the Gospels people still lived under the Old Covenant.","ctx":"Matthew wrote especially for Jews (many OT quotes), Mark for Romans (fast-paced action), Luke for Greeks (careful history, written to Theophilus), John for everyone, “that you may believe” (20:31).","ex":"Gospels = meet Him; Acts = join Him; Epistles = walk with Him; Revelation = reign with Him.","ask":"Which Gospel would you give to a friend first, and why?"},{"s":"B","t":"Birth of Jesus","pts":["Mary, a virgin, conceives by the Holy Spirit (Luke 1:31-35; Matt 1:20-23).","Jesus = “Jehovah is salvation”; Immanuel = “God with us.”","“Son of God” refers to God manifest in flesh — the Bible says “Son of God,” not “God the Son.”","Isaiah 9:6 — the Child is called Mighty God, Everlasting Father.","Fulfils Genesis 3:15 — the Seed of the woman."],"refs":["Luke 1:31-35","Matthew 1:20-23","Isaiah 7:14","Isaiah 9:6","1 Timothy 3:16","Genesis 3:15"],"explain":"Luke 1:35 explains why He is called Son of God: “therefore… that Holy One who is to be born will be called the Son of God” — because His conception was by the Holy Spirit. This course’s teaching: the term Son refers to God’s manifestation in flesh, not a second God (Deut 6:4; Isa 44:6). Isaiah 9:6 calls the Child both “Mighty God” and “Everlasting Father.” 1 Tim 3:16: “God was manifested in the flesh.”","ctx":"Jesus’ name is Yeshua (short for Yehoshua/Joshua) — a common name, but given by the angel for its meaning. Bethlehem means “house of bread” — the birthplace of the Bread of Life (Micah 5:2). Most scholars date His birth around 6–4 BC, since Herod the Great died in 4 BC; the BC/AD system devised by Dionysius Exiguus (AD 525) was off by a few years.","ex":"Water, ice and steam is often used for a 3-person God; this course prefers: one man can be a father, son and husband in different relationships — one person, many roles.","ask":"What does “God with us” mean for you this week?","key":1},{"s":"C","t":"John the Baptist","pts":["The messenger who prepares the way (Mal 3:1; Isa 40:3-4).","Preached a baptism of repentance (Luke 3:3-6) — repentance is the prerequisite for God coming into our lives.","“Behold! The Lamb of God who takes away the sin of the world!” (John 1:29).","Jesus will baptize with the Holy Spirit and fire (Luke 3:16)."],"refs":["Malachi 3:1","Isaiah 40:3-4","Luke 3:3-6,15-16","John 1:29"],"explain":"Connect “Lamb of God” to every lamb so far — the animal skins (Lesson 2), Abel’s lamb (3), the ram for Isaac (4), the Passover lamb (5), the Day of Atonement (6). John points to the fulfilment of them all. Malachi 3:1 says the messenger prepares the way “before Me” (the LORD) — and John prepares the way for Jesus.","ctx":"John was born to a priest (Zechariah) yet ministered in the wilderness by the Jordan, dressed like Elijah (2 Kings 1:8; Matt 3:4). The Jordan was where Israel first entered the Promised Land — a symbolic place for a new beginning.","ex":"A road crew clearing the way before a royal visit (Isa 40:3-4).","ask":"What “road” in your life needs clearing for the Lord to come in?"},{"s":"D","t":"The life ministry of Jesus","pts":["Miracles: healing the blind (Matt 9:27-31), raising Lazarus (John 11), calming the storm (Mark 4:35-41), casting out demons (Luke 4:33-37), feeding 5,000 (Matt 14:15-21).","Preaching and teaching with authority; parables reveal truth to the hungry and hide it from the uninterested (Matt 13:10-16).","Making disciples — those who follow, learn and obey (Matt 4:19; 16:24; John 8:31-32); He sent them to do the same works (Matt 10:1-8)."],"refs":["Matthew 9:27-31","John 11:43-45","Mark 4:35-41","Job 9:8","Luke 4:33-37","Matthew 14:15-21","Matthew 13:10-16","Matthew 4:19","Matthew 16:24","John 8:31-32","Matthew 10:1-8"],"explain":"Calming the storm: the disciples ask “Who can this be, that even the wind and the sea obey Him?” In the OT only Jehovah rules the sea (Job 9:8; Ps 89:9; Ps 107:29) — the miracle answers the question. “Disciple” (mathētēs) = learner/apprentice; in Jewish culture a rabbi’s disciples followed him so closely they would be “covered in the dust of the rabbi.”","ctx":"Most of Jesus’ ministry was in Galilee — a fishing and farming region around the Sea of Galilee, home to Capernaum (His base). The Sea of Galilee sits ~210 m below sea level surrounded by hills, so sudden violent storms are common. A first-century fishing boat (the “Jesus boat”) was found in its mud in 1986.","ex":"Parable = a window and a curtain: a window for the hungry, a curtain for the indifferent.","ask":"What’s the difference between a fan of Jesus and a disciple of Jesus?","key":2},{"s":"E","t":"Who does the Bible say Jesus is?","pts":["The Messiah, the Son of God (Matt 11:1-5; John 20:30-31).","The Word made flesh (John 1:1, 14).","God manifested in the flesh (1 Tim 3:16).","The image of the invisible God (Col 1:15); “He who has seen Me has seen the Father” (John 14:6-9).","“I and My Father are one” (John 10:30-33).","The “I AM” of the Old Testament (John 8:56-59).","Why flesh? God is Spirit and cannot bleed or die, so He prepared a body to redeem us (Isa 59:15-20; 2 Cor 5:18-19; Titus 2:13-14)."],"refs":["Matthew 11:2-5","John 20:30-31","John 1:1,14","1 Timothy 3:16","Colossians 1:15","Colossians 2:9","John 14:6-9","John 10:30-33","John 8:56-59","Isaiah 59:15-20","2 Corinthians 5:18-19","Titus 2:13-14","Hebrews 10:5"],"explain":"John 8:58 — Jesus doesn’t say “Before Abraham was, I was” but “I AM,” echoing Exodus 3:14 (Lesson 5); the crowd understood and picked up stones for blasphemy. John 10:33: “You, being a Man, make Yourself God.” Colossians 2:9: “in Him dwells all the fullness of the Godhead bodily.” Hebrews 10:5: “a body You have prepared for Me.” Isaiah 59:16: God “saw there was no man… therefore His own arm brought salvation” — so He came Himself.","ctx":"“Messiah” (Hebrew mashiach) and “Christ” (Greek christos) both mean “Anointed One” — the title of prophets, priests and kings, who were anointed with oil. By Jesus’ day, people expected a political deliverer from Rome; Jesus came first to deliver from sin.","ex":"Thomas: “My Lord and my God!” (John 20:28) — Jesus accepted the worship.","ask":"Which verse here most clearly answers “Who is Jesus?” for you?","key":4},{"s":"F","t":"Jesus forgave sins","pts":["Paralytic: “Son, your sins are forgiven” (Matt 9:2-7; Mark 2:5-7).","The scribes: “Who can forgive sins but God alone?”","He proved His authority by healing — and later died to pay sin’s penalty."],"refs":["Matthew 9:2-7","Mark 2:5-7"],"explain":"The scribes’ theology was right — only God forgives sin. Their conclusion was wrong. Jesus asks: which is easier to say? Anyone can say “your sins are forgiven” (unprovable), so He did the visible miracle to prove the invisible one.","ctx":"In Capernaum houses had flat roofs of beams, branches and packed clay — easy to dig through, as the four friends did (Mark 2:4).","ex":"If someone hurts your friend and I say “I forgive you,” that’s strange — unless I’m the one ultimately offended. Every sin is against God (Ps 51:4).","ask":"Why was forgiving sins more controversial than miracles?","key":5},{"s":"G","t":"The death, burial and resurrection","pts":["Betrayal, illegal trial, Pontius Pilate, “Let Him be crucified!” (Matt 27).","Scourging and crucifixion fulfilled Isaiah 53 and Psalm 22.","He gave His life willingly (Matt 26:53-54) — God’s hidden plan (1 Cor 2:7-8).","The veil torn from top to bottom (Matt 27:50-51).","Buried in Joseph of Arimathea’s new tomb; risen on the third day; appeared with infallible proofs; Thomas: “My Lord and my God!” (John 20:24-29).","Death, burial and resurrection = the gospel that saves (1 Cor 15:1-4)."],"refs":["Matthew 27:1-2,22-31","Isaiah 53:3-7","Psalm 22:14-18","1 Peter 2:21-24","Hebrews 12:2","Matthew 26:53-54","1 Corinthians 2:7-8","Matthew 27:50-60","John 20:24-29","1 Corinthians 15:1-4,53-57"],"explain":"Psalm 22 (written ~1,000 years before, before crucifixion was invented) includes “they pierced My hands and My feet,” “they divide My garments… cast lots,” and “My God, My God, why have You forsaken Me?” Jesus’ cry on the cross quotes its first line. “It is finished” (tetelestai) was written on receipts: “paid in full.” The veil torn “from top to bottom” — torn by God, not man (Lesson 6).","ctx":"Pontius Pilate was prefect of Judea AD 26–36; a stone inscribed with his name was found at Caesarea in 1961. An ossuary (bone box) inscribed “Joseph son of Caiaphas” — likely the high priest — was found in Jerusalem in 1990. Roman historian Tacitus (Annals 15.44, c. AD 116) records that “Christus” was executed under Pontius Pilate in Tiberius’ reign; Josephus (c. AD 93) also mentions Jesus. Roman scourging used a flagrum — leather thongs with bits of bone or metal. Paul lists over 500 eyewitnesses of the risen Christ, most still alive when he wrote (1 Cor 15:6).","ex":"Lesson 8 will show how we obey each part.","ask":"What does it mean to you personally that Jesus endured the cross “for the joy set before Him”?","key":6}],"keys":["Jesus came to reverse the [curse] of sin and destroy the work of [Satan].","Jesus still demonstrates His power through [miracles] today!","Jesus is still looking for [disciples] today.","Jesus is the God of the Old Testament revealed in [flesh].","God came in flesh to [save] us from our sins.","The [death], [burial] and [resurrection] of Jesus Christ is the gospel that saves Man."],"words":[["Jesus","Hebrew Yeshua","Jehovah is salvation","Matt 1:21."],["Immanuel","Hebrew","God with us","Isa 7:14; Matt 1:23."],["Christ / Messiah","Greek christos / Hebrew mashiach","Anointed One",""],["Disciple","Greek mathētēs","Learner, apprentice",""],["Parable","Greek parabolē","Something “thrown alongside” for comparison",""],["It is finished","Greek tetelestai","Paid in full / completed","John 19:30."],["Godhead","Greek theotēs","Deity, the fullness of God","Col 2:9."]],"background":[["Modular: The Oneness of God (course keys)","1) There is only one God (Deut 6:4; Isa 43:10-11). 2) God is the Holy Spirit (John 4:24; Ps 51:11). 3) God is the Father and Creator (Mal 2:10). 4) God became flesh to save us (1 Tim 3:16). 5) Jesus is the image of the invisible God (Col 1:15). 6) Jesus is the revealed name of the one God (John 5:43; 17:6)."],["Why the identity of Jesus matters","It is the rock the church is built on (Matt 16:13-18); it determines true worship (John 4:22-24); it is essential to salvation (John 8:24; Acts 4:12); and faith in His name releases power (Acts 3:16)."],["Jesus outside the Bible","Tacitus (Roman historian), Josephus (Jewish historian), Pliny the Younger (Roman governor, c. AD 112, describing Christians singing hymns “to Christ as to a god”), and the Babylonian Talmud all refer to Jesus or His followers."]],"qa":[["At Jesus’ baptism the voice spoke from heaven and the dove descended — doesn’t that show separate persons?","In this course’s view, God is omnipresent and can operate in different places and ways at once (Ps 139:7-10). The voice and dove were signs for the people — especially John (John 1:32-34) — not a portrait of three persons. One Spirit can manifest in many places."],["Who was Jesus praying to?","Jesus was fully human as well as God manifest. As a man He prayed, hungered and grew tired; as God He forgave sins and calmed storms. His prayers reflect His genuine humanity (Heb 5:7)."],["John 1:1 says “the Word was with God.” Doesn’t that mean two?","The same verse says “the Word was God.” In this course’s view, the Word (logos) is God’s own thought/plan/expression, which was “with” Him as your word is with you, and “became flesh” in Jesus (1:14)."],["How do we know the resurrection really happened?","The empty tomb, many eyewitnesses (1 Cor 15:5-8), the transformation of frightened disciples into bold witnesses willing to die, and the rapid growth of the church in the very city where Jesus was buried."]],"quiz":[["What does the name Jesus mean?",["Anointed One","Jehovah is salvation","God with us","Prince of Peace"],1,"Yeshua — Jehovah is salvation."],["Who introduced Jesus as “the Lamb of God”?",["Peter","John the Baptist","Mary","Moses"],1,"John 1:29."],["Which OT name did Jesus claim in John 8:58?",["Elohim","I AM","Adonai","El Shaddai"],1,"“Before Abraham was, I AM.”"],["Why were the scribes upset when Jesus forgave sins?",["He didn’t pay","Only God can forgive sins","He was on the Sabbath","He was too young"],1,"Mark 2:7."],["The three parts of the gospel are…",["Faith, hope, love","Death, burial, resurrection","Birth, life, death","Repent, believe, pray"],1,"1 Cor 15:3-4."],["“It is finished” (tetelestai) means…",["I give up","Paid in full","I am tired","Begin again"],1,"A receipt word."]],"bridge":"Jesus died, was buried and rose. Next: how do we obey that gospel? The New Testament plan of salvation.","charts":[{"f":"charts/L7-1.jpg","t":"Between the Testaments: 400 years of silence","sec":0,"no":"Chart L7.1"},{"f":"charts/L7-2.jpg","t":"The New Testament","sec":1,"no":"Chart L7.2"},{"f":"charts/L7-3.jpg","t":"The gospel of Jesus Christ: birth & ministry","sec":2,"no":"Chart L7.3"},{"f":"charts/L7-4.jpg","t":"The gospel of Jesus Christ: death, burial, resurrection","sec":7,"no":"Chart L7.4"},{"f":"charts/L7-5.jpg","t":"Keys of Lesson Seven","sec":-1,"no":"Chart L7.5"}]},{"n":8,"title":"Obeying the Gospel: Repentance & Water Baptism","sub":"God’s New Testament plan of salvation","age":"Church Age","cast":"Jesus, the 120 in the Upper Room, Peter, Philip, Paul, the Ethiopian, Samaritans, Cornelius’ household, John’s disciples","bigIdea":"God has a specific plan of salvation today: we believe and obey the gospel (death, burial, resurrection) through repentance, water baptism in Jesus’ name, and receiving the Holy Spirit.","objectives":["Explain what the gospel is and how to obey it","Describe how baptism was administered in the original Church","Express a desire to repent and be baptized in Jesus’ name"],"flow":[{"s":"Intro","t":"Background — the Great Commission & the waiting","pts":["Jesus: repentance and remission of sins preached in His name, beginning at Jerusalem (Luke 24:46-49).","Wait for the Promise of the Father (Acts 1:4-5)."],"refs":["Luke 24:46-49","Acts 1:1-5"],"explain":"Luke 24:47 is Luke’s version of the Great Commission; he wrote Acts as volume two (Acts 1:1, same Theophilus) and shows the commission being carried out in Acts 2 — beginning at Jerusalem, in His name.","ctx":"After the resurrection Jesus appeared over 40 days (Acts 1:3). The disciples waited ten more days until Pentecost.","ex":"Read Luke 24:47 and Acts 2:38 side by side — the plan and its fulfilment.","ask":"Why do you think Jesus told them to wait instead of starting immediately?"},{"s":"A","t":"The New Testament plan of salvation","pts":["Every age had a specific pathway: Noah — ark; Abraham — circumcision; Israel — Tabernacle; us — the New Birth.","Common principles: Grace, Faith, Obedience (Heb 11:7).","Grace: unmerited favour; God does all the saving work (Eph 2:8; John 1:17; Rom 3:24-25).","Faith in Christ: believing He is Lord and Saviour and believing His words (John 3:16).","Born of water and Spirit (John 3:3-5).","The gospel = Christ died, was buried, rose again (1 Cor 15:1-4; Rom 1:16)."],"refs":["Hebrews 11:7","Ephesians 2:8","John 1:17","Romans 3:24-25","John 3:3-5,16","Romans 1:16","1 Corinthians 15:1-4"],"explain":"Nicodemus (John 3) was a Pharisee and member of the Sanhedrin — a religious expert — yet Jesus told him he must be born again. “Again” (anōthen) can also mean “from above.” Jesus explains: “of water and the Spirit” (3:5). This course unpacks water in this lesson and Spirit in Lesson 9.","ctx":"“Gospel” (euangelion) was a word used in the Roman world for announcements of an emperor’s birth or military victory — “good news” of a new reign. The apostles used it for the victory of Jesus.","ex":"Review chart: Noah’s ark — Abraham’s circumcision — Tabernacle — New Birth. Same God, same principles, new covenant.","ask":"Why do you think Jesus used birth language for salvation?","key":1},{"s":"B","t":"True biblical faith: Knowledge, Agreement, Obedience","pts":["Knowledge — faith comes by hearing (Rom 10:14, 17); Peter preached Jesus as Lord and Christ (Acts 2:22-24, 36).","Agreement — “cut to the heart… what shall we do?” (Acts 2:37); faith without works is dead (Jas 2:17-20).","Obedience — not everyone who says “Lord, Lord” (Matt 7:21); He is the author of salvation to all who obey (Heb 5:9)."],"refs":["Romans 10:14,17","Acts 2:22-24,36-37","James 2:17-20","Matthew 7:21","Hebrews 5:9"],"explain":"“Cut to the heart” (katanyssomai) = pierced, stabbed — deep conviction. Peter’s sermon in Acts 2 quoted Joel 2 and Psalms 16 and 110, proving from Scripture that the crucified Jesus is Lord and Christ.","ctx":"Pentecost brought Jews from across the empire (Acts 2:9-11 lists about 15 regions), so the 3,000 converts carried the message home.","ex":"Fire illustration (from Lesson 9): someone yells “Fire!” — knowledge. You believe them — agreement. You run out — obedience.","ask":"Which step — knowledge, agreement, obedience — do most people stop at?","key":2},{"s":"C","t":"Acts 2:38 — obeying the gospel","pts":["“Repent, and let every one of you be baptized in the name of Jesus Christ for the remission of sins; and you shall receive the gift of the Holy Spirit.”","Death → Repentance; Burial → Water baptism in Jesus’ name; Resurrection → Filled with the Holy Spirit (Rom 6:3-5)."],"refs":["Acts 2:38-39","Romans 6:3-5"],"explain":"Acts 2:39: “the promise is to you and to your children, and to all who are afar off” — this answer was not just for the first generation. This course’s framework maps the three parts of the gospel to three parts of our obedience.","ctx":"Peter held “the keys of the kingdom” (Matt 16:19) — this course notes he used them here (Jews), in Acts 8 (Samaritans, with John) and Acts 10 (Gentiles).","ex":"Draw two columns: Christ’s Death | our Repentance; His Burial | our Baptism; His Resurrection | our new life by the Spirit.","ask":"Which part of Acts 2:38 is new to you?","key":3},{"s":"D","t":"Repentance","pts":["Metanoeō — a change of mind leading to a change of direction.","God’s will: not willing that any perish (2 Pet 3:9); “unless you repent you will all likewise perish” (Luke 13:3).","Leads to truth (2 Tim 2:25); godly sorrow vs worldly sorrow (2 Cor 7:10).","Humbling ourselves (Matt 5:3); confessing and forsaking (Prov 28:13).","Fruit: a change in action."],"refs":["2 Peter 3:9","Luke 13:3","2 Timothy 2:25","2 Corinthians 7:10","Matthew 5:3","Proverbs 28:13","Acts 3:19"],"explain":"2 Cor 7:10 contrasts two sorrows: worldly sorrow is sorry for getting caught or for the consequences (think Esau, Heb 12:17); godly sorrow is sorry for offending God and leads to change (think David, Psalm 51). The Hebrew OT idea is shuv — to turn around.","ctx":"In Greek, metanoia was used of a change of mind or plan. John the Baptist and Jesus both began with the same word: “Repent” (Matt 3:2; 4:17).","ex":"A driver heading the wrong way on the highway: being sorry isn’t enough — you must take the next U-turn.","ask":"What’s the difference between regret and repentance?","key":4},{"s":"E","t":"Water baptism — the burial","pts":["Buried with Him through baptism into death; raised to walk in newness of life (Rom 6:3-5).","Baptizō = to immerse, submerge, overwhelm.","The Ethiopian eunuch: in a desert, found water, believed, went down into and came up out of the water (Acts 8:26-38).","“He who believes and is baptized will be saved” (Mark 16:16)."],"refs":["Romans 6:3-5","Acts 8:26-39","Mark 16:16"],"explain":"Baptizō was used for a ship sinking, cloth being dyed, and vegetables being pickled. A Greek physician (Nicander, c. 200 BC) wrote a pickling recipe using both bapto (dip briefly) and baptizō (immerse to change permanently). Baptism isn’t a quick dip; it signifies a lasting change. Burial requires covering — immersion fits Paul’s burial picture. (See modular: Immerse or Sprinkle.)","ctx":"The Ethiopian was treasurer for the Kandake (Candace) — a royal title of the queen-mothers of the kingdom of Kush/Meroë (modern Sudan). He had travelled ~1,500 km to worship in Jerusalem and was reading Isaiah 53 in Greek. Jewish ritual immersion pools (mikva’ot) were common; dozens have been excavated by the Temple Mount’s southern steps — showing how 3,000 could be baptized in Jerusalem in one day.","ex":"You don’t bury someone by sprinkling dust on them — you cover them completely.","ask":"Why do you think God chose water and burial as the picture of our new beginning?","key":5},{"s":"F","t":"Purpose of baptism","pts":["Washes away sins (Acts 22:16).","For the remission of sins (Acts 2:38).","Puts us into Christ and His Body (Gal 3:27; 1 John 5:11; Acts 2:41).","Where we contact the blood of Jesus (Matt 26:28; Rev 1:5).","Saves us — the answer of a good conscience (1 Pet 3:21; Mark 16:16).","Burial of the old life (Rom 6:4-6); part of the new birth (John 3:5).","Puts us in covenant — circumcision without hands (Col 2:11-12)."],"refs":["Acts 22:16","Acts 2:38","Galatians 3:27","Matthew 26:28","Revelation 1:5","1 Peter 3:20-21","Colossians 2:11-12"],"explain":"Blood or water? This course’s answer: both — the blood of Jesus is applied when we are baptized in His name (like the Passover lamb’s blood had to be applied, Lesson 5). 1 Peter 3:20-21 links Noah’s flood to baptism (Lesson 3): water that judged the old world carried the ark to a new one. “Not the removal of the filth of the flesh” — it’s not a bath; it’s faith answering God.","ctx":"Paul’s own conversion: three days after meeting Jesus, Ananias told him, “Arise and be baptized, and wash away your sins, calling on the name of the Lord” (Acts 22:16).","ex":"Remission (aphesis) = release, cancellation of a debt — like a bank stamping “CANCELLED” on a loan.","ask":"Which purpose of baptism surprised you?"},{"s":"G","t":"Baptisms in the early Church","pts":["Jews at Pentecost — in the name of Jesus Christ (Acts 2:38-41).","Samaritans — in the name of the Lord Jesus (Acts 8:5, 12, 16).","Gentiles at Cornelius’ house — in the name of the Lord (Acts 10:44-48).","John’s disciples re-baptized — in the name of the Lord Jesus (Acts 19:1-5).","Question: what name was used every time?"],"refs":["Acts 2:38-41","Acts 8:12,16","Acts 10:44-48","Acts 19:1-5"],"explain":"Acts 19 is striking: these disciples had already been baptized (by John) yet Paul baptized them again in the name of the Lord Jesus.","ctx":"Samaritans were descendants of northern Israelites who intermarried with foreigners after Assyria’s conquest (722 BC); Jews and Samaritans despised each other (John 4:9). Cornelius was a Roman centurion of the Italian cohort at Caesarea — a “God-fearer” Gentile. The gospel moves outward exactly as Acts 1:8 predicted: Jerusalem → Judea and Samaria → ends of the earth.","ex":"Make a 4-row table on the board: Group | Reference | Name used.","ask":"Why do you think Luke records the baptism formula in each case?"},{"s":"H","t":"The name of Jesus in baptism","pts":["A name carries identity, nature and authority; salvation is in no other name (Acts 4:12; Ps 54:1).","Do all in the name of the Lord Jesus (Col 3:17); every knee bows at His name (Phil 2:10-11).","Matthew 28:19 — “in the name” (singular) of the Father, Son and Holy Spirit.","Father, Son, Holy Spirit are titles; the name: Father — Jesus came in His Father’s name (John 5:43); Son — call His name Jesus (Matt 1:21); Holy Spirit — sent in My name (John 14:26).","So baptism in Jesus’ name fulfils Matthew 28:19."],"refs":["Acts 4:12","Luke 24:47","Colossians 3:17","Philippians 2:10-11","Matthew 28:18-20","John 5:43","John 17:6","Matthew 1:21","John 14:26","Acts 22:16"],"explain":"Matt 28:18 begins “All authority has been given to Me” — so baptism is done in His authority and name. Note “name” is singular. This course’s reasoning: the apostles who heard Matthew 28:19 obeyed it by baptizing in Jesus’ name in every recorded case in Acts — they understood the name to be Jesus.","ctx":"In first-century usage, doing something “in the name of” someone meant by their authority — like a police officer saying “Stop, in the name of the law,” or an ambassador speaking in the name of a king.","ex":"A cheque must be signed with a name, not a title — “Father” won’t clear the bank.","ask":"How do you respond to someone who points to Matthew 28:19?","key":6}],"keys":["God has a specific [plan] for salvation today!","We need to [believe] and [obey] the gospel to be saved.","We obey the Gospel through [Repentance], Water Baptism in [Jesus name] and being filled with the [Holy Spirit].","We experience the death of our old life of sin through our choice of [repentance].","We experience [burial] to our old life/nature in water [baptism].","The only Biblical way to be baptized is in [Jesus name]."],"words":[["Gospel","Greek euangelion","Good news / victory announcement",""],["Repent","Greek metanoeō / Hebrew shuv","Change of mind / turn around",""],["Baptize","Greek baptizō","Immerse, submerge, overwhelm","Not rhantizō (sprinkle)."],["Remission","Greek aphesis","Release, cancellation of debt","Acts 2:38."],["Born again","Greek gennēthē anōthen","Born again / from above","John 3:3."],["Cut to the heart","Greek katanyssomai","Pierced, stabbed","Acts 2:37."]],"background":[["Modular: Immerse or Sprinkle","Immersion fits every biblical description: “much water” (John 3:23), “went down into the water” and “came up out of the water” (Acts 8:38-39), “buried” (Rom 6:4), “planted” (Rom 6:5). The Greek word for sprinkle (rhantizō) is never used for baptism."],["Modular: The Sinner’s Prayer","This course includes a section noting that the phrase “sinner’s prayer” is not found in Scripture; the NT response to the gospel is repentance, baptism and receiving the Spirit (Acts 2:38). Prayer and confession are part of repentance."],["History of the baptism formula","Every baptism described in Acts uses the name of Jesus. Some early Christian writings (e.g., the Didache, c. AD 100) use the triune titles, while also speaking of those “baptized into the name of the Lord.” Oneness Pentecostals regard Acts as the authoritative pattern. If a student raises later church history, point them back to what the apostles actually did in Acts."]],"qa":[["What about the thief on the cross — he wasn’t baptized?","He lived and died under the Old Covenant; the New Testament took effect after Jesus’ death (Heb 9:16-17, Lesson 7). Also, Jesus had authority on earth to forgive sins directly (Mark 2:10)."],["Isn’t baptism a “work”? We’re saved by grace through faith.","Baptism is not a work we do to earn salvation; it is obedience of faith to God’s command, where God does the work (Col 2:12 “through faith in the working of God”). Noah’s building didn’t earn grace either (Lesson 3)."],["I was baptized as a baby / with the titles — do I need to be baptized again?","Acts 19:1-5 shows people previously baptized being baptized again in the name of the Lord Jesus. Encourage them to study the Acts accounts and talk with the pastor."],["Is Acts 8:37 in my Bible?","Some modern translations omit or footnote verse 37 because it is missing from many early manuscripts. The principle — faith in Jesus before baptism — is clear elsewhere (Mark 16:16)."]],"quiz":[["What two components of the new birth did Jesus mention to Nicodemus?",["Faith and works","Water and Spirit","Blood and fire","Prayer and fasting"],1,"John 3:5."],["The three parts of true faith in this lesson are…",["Hope, love, joy","Knowledge, agreement, obedience","Grace, mercy, peace","Read, hear, keep"],1,"Section B."],["Baptizō means…",["Sprinkle","Pour","Immerse","Anoint"],2,"Immerse/submerge."],["We obey the burial of Christ through…",["Repentance","Water baptism","Communion","Tongues"],1,"Rom 6:4."],["In Acts, in what name were people baptized?",["Father, Son and Holy Spirit","The name of Jesus","Moses","The church"],1,"Acts 2:38; 8:16; 10:48; 19:5."],["Which group was re-baptized in Acts 19?",["Samaritans","Disciples of John the Baptist","Pharisees","Romans"],1,"Acts 19:1-5."]],"bridge":"We’ve died (repentance) and been buried (baptism). Next: resurrection life — being born of the Spirit.","charts":[{"f":"charts/L8-1.jpg","t":"The New Birth: Day of Pentecost","sec":0,"no":"Chart L8.1"},{"f":"charts/L8-2.jpg","t":"The New Birth: obeying the gospel","sec":3,"no":"Chart L8.2"},{"f":"charts/L8-3.jpg","t":"The apostles taught and practised water baptism in Jesus’ name","sec":7,"no":"Chart L8.3"},{"f":"charts/L8-4.jpg","t":"Keys of Lesson Eight","sec":-1,"no":"Chart L8.4"}]},{"n":9,"title":"Born of the Spirit: The Gift of the Holy Spirit","sub":"God’s promise to fill every believer with His Spirit","age":"Church Age","cast":"Jesus, Nicodemus, Peter, Cornelius & household, Paul, John, John’s disciples, Philip, Samaritans, Ananias","bigIdea":"God promised to pour out His Spirit on all flesh; anyone who believes can receive the Holy Spirit, and speaking in tongues is the initial biblical evidence.","objectives":["Recognise that God desires to fill every person with His Spirit","Identify speaking in tongues as the initial biblical evidence of receiving the Spirit","Express a desire to receive the Holy Spirit"],"flow":[{"s":"A","t":"Recap: the plan of salvation","pts":["Acts 2:38 — repent, be baptized in Jesus’ name, receive the gift of the Holy Spirit.","Born of water and of the Spirit (John 3:5-7).","Last lesson: repentance and water; this lesson: Spirit."],"refs":["Acts 2:38","John 3:5-7"],"explain":"Use the Exodus pattern from Lesson 5: blood (Passover) → sea (baptism) → cloud (Spirit). 1 Cor 10:2 says they were baptized “in the cloud and in the sea.”","ctx":"Ask a student to recap Lesson 8’s three-part chart.","ex":"Birth needs both water and breath: a baby passes through water and then breathes.","ask":"Can someone explain how Lessons 5, 8 and 9 connect?"},{"s":"B","t":"Who is the Holy Spirit?","pts":["The Spirit of God at creation (Gen 1:2).","God is Spirit (John 4:24) and holy (1 Pet 1:16).","The same Spirit was manifested in flesh as Jesus and lives in believers (1 Tim 3:16; Rom 8:9 “Spirit of God” = “Spirit of Christ”)."],"refs":["Genesis 1:2","John 4:24","1 Peter 1:16","1 Timothy 3:16","Romans 8:9","Colossians 1:27"],"explain":"Romans 8:9 uses “Spirit of God” and “Spirit of Christ” interchangeably in one verse; 8:10 says “Christ is in you.” Colossians 1:27: “Christ in you, the hope of glory.” In this course’s view, the Holy Spirit is not a separate person but the one God at work in and among us.","ctx":"Both Hebrew ruach and Greek pneuma mean breath, wind and spirit — the same word. That is why Jesus’ wind analogy (John 3:8) is a wordplay.","ex":"Breath you can’t see — but you know someone is alive because they breathe.","ask":"What difference does it make that the Holy Spirit is God Himself living in you?","key":1},{"s":"C","t":"The promise — Old Testament & Jesus","pts":["Joel 2:28-29 — “I will pour out My Spirit on all flesh.”","Isaiah 44:3; Ezekiel 37:14 — water on the thirsty, Spirit in dry bones.","Jesus: rivers of living water (John 7:37-39); another Helper… “I will come to you” (John 14:15-18).","Wait for the Promise of the Father (Acts 1:4-5)."],"refs":["Joel 2:28-29","Isaiah 44:3","Ezekiel 37:14","John 7:37-39","John 14:15-18","Acts 1:4-5"],"explain":"John 7:37 — “on the last day, that great day of the feast” (of Tabernacles): priests poured water from the Pool of Siloam at the altar each day, praying for rain and the Messianic age. Into that moment Jesus shouted, “If anyone thirsts, let him come to Me and drink.” John 14:18: “I will not leave you orphans; I will come to you” — the Helper is Jesus Himself coming in Spirit.","ctx":"In the OT the Spirit came upon select people — prophets, judges, kings, craftsmen (Bezalel, Ex 31:3) — often temporarily (Saul, 1 Sam 16:14). Moses wished “that all the LORD’s people were prophets and that the LORD would put His Spirit upon them!” (Num 11:29). Joel promised that day was coming — for everyone.","ex":"Promise from a father: “When you graduate, I’ll give you…” — the disciples waited for the Father’s promised gift.","ask":"Why do you think God promised the Spirit for “all flesh” rather than a select few?","key":2},{"s":"D","t":"Being born of the Spirit","pts":["“The wind blows where it wishes, and you hear the sound of it… So is everyone who is born of the Spirit” (John 3:8).","“Everyone” — a common experience for all believers."],"refs":["John 3:5-8"],"explain":"Discussion: what are wind’s characteristics? Invisible, powerful, can’t be controlled — but you hear its sound and see its effects. Jesus says the same will be true of “everyone” born of the Spirit: there will be a sound.","ctx":"Nicodemus came “by night” (3:2) — perhaps cautious about being seen with Jesus. Later he openly helps bury Jesus (John 19:39): the wind did its work.","ex":"","ask":"Discussion questions: What element did Jesus use? List wind’s characteristics. How did He describe its effects?"},{"s":"E","t":"The first outpouring — Pentecost","pts":["120 waiting in one accord (Acts 1:15; 2:1).","Sound of a rushing mighty wind; divided tongues as of fire; all filled and spoke with other tongues (Acts 2:1-4).","The crowd heard their own languages (Acts 2:6-11); Peter: “This is what was spoken by the prophet Joel” (2:16)."],"refs":["Acts 2:1-18","Acts 1:15"],"explain":"Notice “all” were filled and “began to speak with other tongues, as the Spirit gave them utterance” — they spoke, the Spirit gave the words. Pentecost reverses Babel (Lesson 4): at Babel languages scattered proud people; at Pentecost languages gathered humble people into one body praising God.","ctx":"Pentecost (“fiftieth”) is the Jewish Feast of Weeks (Shavuot), 50 days after Passover — Jesus died at Passover and the Spirit came at Pentecost. Jewish tradition links Shavuot to the giving of the Law at Sinai (Lesson 5). At Sinai: fire on the mountain, the Law on stone, ~3,000 died (Ex 32:28). At Pentecost: fire on the believers, the law written on hearts (Jer 31:33), ~3,000 saved (Acts 2:41). “The letter kills, but the Spirit gives life” (2 Cor 3:6).","ex":"","ask":"What happened to the disciples when they were filled with the Holy Spirit?"},{"s":"F","t":"Other accounts in Acts","pts":["Cornelius’ household (Gentiles): Spirit fell; “they heard them speak with tongues and magnify God” (Acts 10:44-46; 11:15-17; 15:7-9).","John’s disciples at Ephesus: baptized in Jesus’ name, then hands laid on them — spoke with tongues and prophesied (Acts 19:1-6).","Samaritans: believed and were baptized but had not yet received the Spirit; something visible made Simon want to buy it (Acts 8:14-20).","Paul: filled when Ananias came (Acts 9:17-18); later “I speak with tongues more than you all” (1 Cor 14:18).","Isaiah 28:11 — “with stammering lips and another tongue.”"],"refs":["Acts 10:44-48","Acts 11:15-17","Acts 15:7-9","Acts 19:1-6","Acts 8:14-20","Acts 9:17-18","1 Corinthians 14:18","Isaiah 28:11"],"explain":"How did Peter know the Gentiles had received the Spirit? “For they heard them speak with tongues” (10:46). Peter calls it “the same gift as He gave us” (11:17). Notice: the Ephesian disciples already believed yet received the Spirit as a separate experience; the Samaritans were baptized but didn’t automatically receive. Isaiah 28:11 is quoted by Paul in 1 Corinthians 14:21 about tongues.","ctx":"Ephesus was home to the great Temple of Artemis, one of the Seven Wonders of the ancient world, and a centre of magic (Acts 19:19 — scrolls worth 50,000 pieces of silver burned).","ex":"Pattern table: Group | Reference | What was seen/heard.","ask":"Why do you think God chose the tongue as the evidence?","key":3},{"s":"G","t":"Our tongue reveals our heart","pts":["Out of the abundance of the heart the mouth speaks (Matt 12:34).","The tongue is like a bit or a rudder — small but steers everything (Jas 3:2-5).","No man can tame the tongue (Jas 3:8) — but God can."],"refs":["Matthew 12:34","James 3:2-8"],"explain":"This course’s reasoning: the tongue is the one member no human can tame; when God takes control of the tongue, it shows He has taken control of the whole person.","ctx":"James was likely the brother of Jesus and leader of the Jerusalem church (Acts 15). His letter is full of practical, proverb-like teaching.","ex":"A horse’s bit and a ship’s rudder: whoever controls the small thing controls the big thing.","ask":"What does it say about God that He chose to fill the most “untameable” part of us?"},{"s":"H","t":"Why do we need the Holy Spirit?","pts":["Identifies us as Christ’s (Rom 8:9).","Seal and guarantee of our inheritance (Eph 1:13-14).","Pours God’s love into our hearts (Rom 5:5).","Writes God’s law on our hearts, empowers us to obey (Jer 31:33; Ezek 36:26-27).","Teacher and Comforter (John 14:26; 16:13).","Joy, peace, hope (Rom 15:13; Col 1:27).","Fruit of the Spirit (Gal 5:22-23); gifts of the Spirit (1 Cor 12:7-11); power to witness (Acts 1:8)."],"refs":["Romans 8:9","Ephesians 1:13-14","Romans 5:5","Jeremiah 31:33","Ezekiel 36:26-27","John 14:26","John 16:13","Romans 15:13","Galatians 5:22-23","1 Corinthians 12:7-11","Acts 1:8"],"explain":"Eph 1:13-14: “sealed” (sphragizō) — like a royal wax seal marking ownership; “guarantee” (arrabōn) — a down payment or engagement deposit guaranteeing the rest. In modern Greek arrabōna means an engagement ring. Acts 1:8: “power” (dynamis).","ctx":"In the Roman world, a seal on a document or shipment showed who owned it and that it was authentic and protected until delivery.","ex":"A down payment on a house: the first part now guarantees the full thing later.","ask":"Which of these do you most need in your life right now?"},{"s":"I","t":"Receiving the Spirit by faith","pts":["The Spirit is God’s gift, received by faith (Eph 2:8-9).","The promise is to you, your children, all afar off (Acts 2:39).","Ask, seek, knock — how much more will the Father give the Holy Spirit to those who ask! (Luke 11:9-13)."],"refs":["Ephesians 2:8-9","Acts 2:39","Luke 11:9-13","Galatians 3:14"],"explain":"Luke 11:11-13: a good father won’t give a stone for bread or a serpent for fish — some people fear they will receive something “fake.” Jesus reassures them: if you ask your heavenly Father for the Spirit, you get the Spirit. See modular: 6 simple steps (repent, desire, ask in faith, praise/worship, yield, keep seeking).","ctx":"Galatians 3:14: “that we might receive the promise of the Spirit through faith.”","ex":"A gift is received, not earned — open your hands.","ask":"Is there anything stopping you from asking God for His Spirit today?","key":4},{"s":"J","t":"Parallels: physical birth & spiritual birth","pts":["Seed → conception: the Word of God is the incorruptible seed (1 Pet 1:23).","Growth in the womb → faith grows by hearing (Rom 10:17): knowledge, agreement, action.","Baby turns head-down → repentance: changing direction toward God.","Water breaks, first breath/cry → born of water and Spirit (John 3:3-5)."],"refs":["1 Peter 1:23","Romans 10:17","John 3:3-5"],"explain":"Point gently: a baby can be alive and growing (faith) and turned (repentance) yet still not born. The birth completes the process. Doctors listen for the first cry — the audible sign of life.","ctx":"","ex":"Use the chart from the lesson as a whiteboard summary.","ask":"Where are you in this birth process?","key":5}],"keys":["The Holy Spirit is the [eternal] Spirit of God.","Both the Old Testament and Jesus promises the [gift] of the Holy Spirit.","Speaking in [tongues] is the initial [evidence] of someone receiving the Holy Spirit.","Having [faith] in Jesus is the key to receiving the gift of the Holy Spirit.","[Anyone] can receive the gift of the Holy Spirit [anytime] and anywhere."],"words":[["Spirit","Hebrew ruach / Greek pneuma","Breath, wind, spirit","John 3:8 wordplay."],["Pentecost","Greek pentēkostē","Fiftieth (day)","Feast of Weeks / Shavuot."],["Tongues","Greek glōssa","Tongue, language","Glossolalia."],["Helper / Comforter","Greek paraklētos","One called alongside","John 14:16."],["Sealed","Greek sphragizō","Marked with an owner’s seal","Eph 1:13."],["Guarantee","Greek arrabōn","Down payment, pledge","Eph 1:14."],["Power","Greek dynamis","Ability, might","Acts 1:8."]],"background":[["Modular: 6 simple steps to receive the Holy Spirit","1) Repent — remove barriers (sin, unforgiveness, pride). 2) Desire — God won’t force Himself (Rev 3:20; Matt 7:7-8). 3) Ask in faith (Luke 11:13). 4) Praise and worship — lift your voice to God. 5) Yield your tongue and let the Spirit give utterance (Acts 2:4). 6) Keep seeking — don’t be discouraged."],["The Pentecostal revival in modern history","On 1 January 1901, at Charles Parham’s Bethel Bible School in Topeka, Kansas, Agnes Ozman spoke in tongues after prayer. In 1906 the Azusa Street revival in Los Angeles, led by William J. Seymour, spread Pentecostalism worldwide. From 1913–1914, a strand of the movement began baptizing in Jesus’ name and teaching the Oneness of God — the roots of churches like this one."],["Tongues in 1 Corinthians 12–14","Paul distinguishes tongues as a sign/prayer language (14:2, 14) from the gift of tongues with interpretation in church gatherings (12:10; 14:27-28). This course focuses on tongues as the initial evidence of the Spirit baptism, as in Acts."]],"qa":[["Doesn’t 1 Cor 12:30 say “Do all speak with tongues?” (implying no)?","In this course’s view, 1 Cor 12 is about the gift of tongues for public ministry in church (with interpretation), not the initial evidence everyone experiences when filled (Acts 2:4 “all”). Paul himself wished all spoke in tongues (14:5)."],["I already believe — don’t I already have the Spirit?","Acts 19:2 asks believers, “Did you receive the Holy Spirit when you believed?” — implying it is possible to believe without having received. The Samaritans also believed and were baptized before receiving (Acts 8)."],["What if I try and nothing happens?","Keep seeking (Luke 11:9 — the verbs mean keep asking, keep seeking, keep knocking). Remove barriers, worship, and trust God’s promise (Acts 2:39)."],["Is speaking in tongues just people making noises?","In Acts 2 the tongues were real languages understood by foreign visitors. The Spirit gives the utterance; the person speaks. Paul says it is speaking to God (1 Cor 14:2)."]],"quiz":[["Which prophet foretold “I will pour out My Spirit on all flesh”?",["Isaiah","Joel","Jeremiah","Malachi"],1,"Joel 2:28."],["What did Jesus compare being born of the Spirit to?",["Fire","Water","Wind","Light"],2,"John 3:8."],["How many waited in the upper room?",["12","70","120","3,000"],2,"Acts 1:15."],["How did Peter know Cornelius’ household received the Spirit?",["They fainted","They heard them speak with tongues","They were baptized","An angel told him"],1,"Acts 10:46."],["“Pentecost” means…",["Harvest","Fiftieth","Fire","Wind"],1,"50 days after Passover."],["The Holy Spirit as “guarantee” (arrabōn) means…",["A warning","A down payment / pledge","A command","A reward"],1,"Eph 1:14."]],"bridge":"After Pentecost, 3,000 new believers “continued steadfastly in the apostles’ doctrine.” Next: what that doctrine is and why it matters.","charts":[{"f":"charts/L9-1.jpg","t":"The New Birth: being born of the Spirit","sec":2,"no":"Chart L9.1"},{"f":"charts/L9-2.jpg","t":"Keys of Lesson Nine","sec":-1,"no":"Chart L9.2"}]},{"n":10,"title":"The Apostles’ Doctrine","sub":"Who the apostles were and why their teaching is the foundation of the Church","age":"Church Age","cast":"Jesus, the apostles, the early Church","bigIdea":"The born-again believer continues steadfastly in the apostles’ doctrine — received from Jesus, written in the New Testament — and must propagate, protect and preserve it.","objectives":["State the importance of the apostles’ doctrine to a believer’s faith","Explain who the apostles were","Compare their current beliefs with the apostles’ doctrine"],"flow":[{"s":"A","t":"What happened after Pentecost","pts":["3,000 baptized; they continued steadfastly in the apostles’ doctrine, fellowship, breaking of bread and prayers (Acts 2:41-43).","“Continue steadfastly” = live in it: seek, discuss, find and walk the Truth.","Today the apostles’ doctrine is the New Testament — written by apostles or close associates who were eyewitnesses or knew eyewitnesses."],"refs":["Acts 2:41-47"],"explain":"“Continued steadfastly” (proskartereō) = to persist, devote oneself, hold fast. Acts 2:42 lists four devotions — doctrine, fellowship (koinōnia, sharing life), breaking of bread (meals and the Lord’s Supper), prayers. Doctrine comes first in the list.","ctx":"New Testament authors: apostles (Matthew, John, Peter, Paul) and close associates — Mark (Peter’s companion), Luke (Paul’s companion and a physician), James and Jude (Jesus’ brothers).","ex":"Joining a gym vs continuing at the gym: the benefit is in steadfast continuing.","ask":"Which of the four devotions in Acts 2:42 is strongest in your life? Weakest?","key":1},{"s":"B","t":"Who were the apostles? What is doctrine?","pts":["Twelve chosen by Jesus and named apostles (Luke 6:13).","Their teaching is the line between truth and deception (1 John 4:6).","Doctrine (didachē) = instruction.","Make disciples, baptize, teach — a cycle until the end of the age (Matt 28:19-20).","The first “birthmark” of a New Testament church: the apostles’ doctrine (Matt 16:18)."],"refs":["Luke 6:13-16","1 John 4:6","Matthew 28:19-20","Matthew 16:18"],"explain":"“Apostle” (apostolos) = “one who is sent,” an envoy carrying the authority of the sender. Matthew 28:20 “teaching them to observe all things that I have commanded you” — so the apostles’ doctrine is Jesus’ commands, passed on.","ctx":"The Twelve: Simon Peter, Andrew, James and John (sons of Zebedee), Philip, Bartholomew (likely Nathanael), Thomas, Matthew (Levi), James son of Alphaeus, Thaddaeus (Judas son of James), Simon the Zealot, Judas Iscariot — replaced by Matthias (Acts 1:26). Paul was later called as apostle to the Gentiles (Rom 11:13). A late-1st-century church manual called “The Didache” (“The Teaching of the Twelve Apostles”) takes its name from this same word.","ex":"An ambassador doesn’t make up foreign policy — he carries his government’s message.","ask":"Why does it matter who chose and sent the apostles?","key":2},{"s":"C","t":"Where did the apostles get their doctrine?","pts":["From Jesus Himself — they walked, talked and lived with Him and witnessed His death and resurrection.","Given keys and authority to bind and loose (Matt 16:19; 18:18).","Led by the Spirit into all truth (John 16:12-13; 14:26).","Rejecting them rejects Jesus (Luke 10:16).","Foundation: apostles and prophets with Christ the chief cornerstone (Eph 2:19-20; Rev 21:14).","Fellowship is determined by their doctrine (1 John 1:3); it leads to one Lord, one faith, one baptism (Eph 4:4-6; 2 Cor 11:3-4)."],"refs":["Matthew 16:19","John 16:12-13","John 14:26","Luke 10:16","Ephesians 2:19-20","Revelation 21:14","1 Corinthians 14:37","Romans 16:17-18","1 John 1:3","2 Corinthians 11:3-4","Ephesians 4:4-6"],"explain":"John 14:26 is a promise to the apostles that the Spirit would “bring to your remembrance all things that I said to you” — the basis for trusting the Gospels’ accuracy. In ancient building, the cornerstone was the first stone laid; every other stone was aligned to it. Jesus is the cornerstone; the apostles’ teaching is laid in line with Him; we are built on top (1 Pet 2:5).","ctx":"“Binding and loosing” were rabbinic terms for forbidding and permitting — declaring what God’s law requires. Jesus gave this authority to the apostles.","ex":"A building’s foundation is laid once — you don’t re-lay it on every floor. The apostles laid it; we build on it.","ask":"Why is it dangerous to accept Jesus’ words in the Gospels but ignore the apostles’ letters?","key":3},{"s":"D","t":"What were they commanded to do with it?","pts":["PROPAGATE — teach and preach it (Matt 28:19-20; Acts 5:28; 1 Tim 1:3).","PROTECT — guard against philosophy, tradition and itching ears (Col 2:8; 2 Tim 4:3-4; Rom 16:17-18; 2 Thess 3:14-15).","PRESERVE — give attention to doctrine, write it down (1 Tim 4:13, 16; Luke 1:3; 2 Pet 3:1)."],"refs":["Acts 5:28","1 Timothy 1:3","Colossians 2:8","2 Timothy 4:3-4","2 Thessalonians 3:14-15","1 Timothy 4:13,16","Luke 1:1-4","2 Peter 3:1"],"explain":"Acts 5:28 — the high priest’s complaint is a compliment: “you have filled Jerusalem with your doctrine.” 2 Tim 4:3 “itching ears” — people who want teachers who scratch their itch rather than tell the truth. 2 Thess 3:15 balances correction with love: “do not count him as an enemy, but admonish him as a brother.” 1 Tim 4:16: doctrine affects both the teacher’s and the hearers’ salvation.","ctx":"Luke 1:1-4 shows Luke as a careful historian who investigated eyewitness accounts to write “an orderly account” — so believers could have certainty.","ex":"Three Ps: like a family heirloom — share it (propagate), lock it safe (protect), maintain it (preserve).","ask":"Which of the three Ps is most needed in today’s church?","key":4},{"s":"E","t":"The foundation of the Church is the apostles’ doctrine","pts":["The church is “the pillar and ground of the truth” (1 Tim 3:15).","Church (ekklesia) = assembly of called-out ones — not a building.","God is a separating God (Lesson 2): light from darkness, truth from error (Luke 12:51; John 17:17).","Doctrine identifies the church and separates it from the world, to be joined to Christ."],"refs":["1 Timothy 3:15","1 Peter 2:9","Luke 12:51","John 17:17"],"explain":"1 Tim 3:15 uses temple architecture: a pillar holds the truth up for all to see; the “ground” (hedraiōma, foundation/buttress) keeps it steady. John 17:17 (AMP): sanctify = purify, consecrate, separate.","ctx":"In Greek cities, the ekklēsia was the official assembly of citizens called out of their homes by a herald to decide public matters. The church is God’s assembly, summoned by the gospel.","ex":"Lesson 2 callback: on Day 1 God separated light from darkness. Truth still separates.","ask":"How does sound doctrine actually change daily life, not just beliefs?","key":5},{"s":"F","t":"Persecution of the Church for the doctrine","pts":["Christ will build His church; hell will resist; the church will prevail (Matt 16:18).","Jesus foretold persecution and false prophets (Matt 24:9-11).","Stephen, the first martyr (Acts 7:59-60).","Commanded not to teach in Jesus’ name (Acts 4:18); scattered by persecution, they preached everywhere (Acts 8:1, 4).","So why so many churches today? See Church History."],"refs":["Matthew 16:18","Matthew 24:9-11","Acts 7:54-60","Acts 4:18-20","Acts 8:1-4"],"explain":"Acts 8:4 — persecution was meant to stop the message; instead it spread it. Notice Stephen’s prayer (“Lord Jesus, receive my spirit… do not charge them with this sin”) mirrors Jesus’ prayers on the cross — and Saul was standing there watching.","ctx":"Stephen’s name (Stephanos) means “crown” — the first to receive the martyr’s crown. Church tradition says most apostles died as martyrs; Scripture records James son of Zebedee killed by Herod Agrippa I in AD 44 (Acts 12:2). Tradition holds Peter was crucified and Paul beheaded in Rome under Nero (c. AD 64–68), and John was exiled to Patmos (Rev 1:9). The North African writer Tertullian (c. AD 197) observed that the blood of Christians is seed.","ex":"Trying to stamp out a fire by scattering it — embers land everywhere and start new fires.","ask":"Where do believers face pressure for their faith today, and how should we respond?"}],"keys":["We need to [continue steadfastly] in the apostles’ doctrine after we are born again.","The apostles were [chosen] and [authorised] by Jesus to build upon what He started on this earth.","The apostles received the doctrine from [Jesus] Himself.","We need to [propagate], [protect] and [preserve] the apostles’ doctrine.","The apostles’ doctrine [separates] us from the world so that we can be [joine
